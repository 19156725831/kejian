<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理课件</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    background: #f6f8fa;
    color: #24292f;
  }

  header {
    padding: 20px 0 16px;
    border-bottom: 1px solid #d0d7de;
    margin-bottom: 8px;
  }
  h1 {
    color: #0969da;
    margin: 0 0 6px;
    font-size: 28px;
  }
  .subtitle {
    color: #57606a;
    font-size: 14px;
    margin: 0;
  }

  /* 顶部册导航 */
  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0 4px;
  }
  .nav a {
    font-size: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #d0d7de;
    color: #0969da;
    text-decoration: none;
    transition: .15s;
  }
  .nav a:hover {
    background: #0969da;
    color: #fff;
    border-color: #0969da;
  }
  .nav a.active {
    background: #0969da;
    color: #fff;
    border-color: #0969da;
  }

  /* 返回 */
  .back {
    display: inline-block;
    margin: 22px 0 0;
    font-size: 14px;
    color: #0969da;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }

  /* 分组标题 */
  .group-title {
    font-size: 20px;
    margin: 14px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #d0d7de;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .group-title .count {
    font-size: 13px;
    color: #8c959f;
    font-weight: 400;
  }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .card {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 16px;
    text-decoration: none;
    color: #0969da;
    font-weight: 600;
    transition: .2s;
    display: block;
    word-break: break-all;
  }
  .card:hover {
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    transform: translateY(-2px);
    border-color: #0969da;
  }
  .card .path {
    display: block;
    font-size: 12px;
    color: #8c959f;
    font-weight: 400;
    margin-top: 6px;
    word-break: break-all;
  }

  /* 首页的册卡片 */
  .group-card {
    padding: 22px 18px;
    font-size: 18px;
  }
  .group-card .path { font-size: 13px; margin-top: 8px; }

  .empty {
    color: #8c959f;
    font-size: 14px;
    padding: 20px 0;
  }

  .fade { animation: fade .18s ease-out; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>物理课件</h1>
  <p class="subtitle" id="subtitle">按册分类，点击卡片打开课件</p>
</header>

<nav class="nav" id="nav"></nav>

<main id="app"></main>

<script src="courses.js"></script>
<script>
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  const subtitle = document.getElementById('subtitle');

  // 兼容旧格式 courseFiles
  const groups = (typeof courseGroups !== 'undefined' && Array.isArray(courseGroups))
    ? courseGroups
    : (typeof courseFiles !== 'undefined' && Array.isArray(courseFiles))
      ? [{ group: '全部课件', items: courseFiles }]
      : [];

  // 只保留有内容的分组
  const validGroups = groups.filter(g => g.items && g.items.length);

  // 小工具
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  if (!validGroups.length) {
    app.innerHTML = '<p class="empty">还没有课件，请先生成 courses.js。</p>';
  } else {
    const total = validGroups.reduce((s, g) => s + g.items.length, 0);
    subtitle.textContent = `共 ${validGroups.length} 册 · ${total} 个课件`;
  }

  /* ---------- 首页：只显示各册卡片（不显示顶部导航） ---------- */
  function renderHome() {
    nav.innerHTML = '';                 // 首页清空导航
    app.innerHTML = '';

    const wrap = el('div', 'grid fade');

    validGroups.forEach((g, i) => {
      const card = el('a', 'card group-card');
      card.href = '#group-' + i;
      card.appendChild(el('span', null, g.group));
      card.appendChild(el('span', 'path', `${g.items.length} 个课件 →`));
      wrap.appendChild(card);
    });

    app.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  /* ---------- 分册页：显示该册的所有课件（有顶部导航） ---------- */
  function renderGroup(index) {
    const g = validGroups[index];
    if (!g) { location.hash = ''; return; }

    nav.innerHTML = '';
    app.innerHTML = '';

    // 顶部导航（只在分册页出现，当前册高亮）
    validGroups.forEach((gg, j) => {
      const navLink = el('a', j === index ? 'active' : null, `${gg.group} (${gg.items.length})`);
      navLink.href = '#group-' + j;
      nav.appendChild(navLink);
    });

    const back = el('a', 'back', '← 返回首页');
    back.href = '#';
    app.appendChild(back);

    const title = el('h2', 'group-title');
    title.appendChild(document.createTextNode(g.group));
    title.appendChild(el('span', 'count', `${g.items.length} 个`));
    app.appendChild(title);

    const grid = el('div', 'grid fade');
    g.items.forEach(c => {
      const a = el('a', 'card');
      a.href = encodeURI(c.path);
      a.appendChild(el('span', null, c.name));
      a.appendChild(el('span', 'path', c.path));
      grid.appendChild(a);
    });
    app.appendChild(grid);

    window.scrollTo(0, 0);
  }

  /* ---------- 简易路由（支持浏览器前进/后退） ---------- */
  function route() {
    const m = location.hash.match(/^#group-(\d+)$/);
    if (m) {
      renderGroup(parseInt(m[1], 10));
    } else {
      renderHome();
    }
  }

  window.addEventListener('hashchange', route);
  route();
</script>

</body>
</html>
