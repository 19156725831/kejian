<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理仿真资源导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a82fb 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #fff;
  }

  header {
    text-align: center;
    margin-bottom: 42px;
  }

  header h1 {
    font-size: clamp(24px, 5vw, 38px);
    letter-spacing: 2px;
    font-weight: 700;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .35);
  }

  header p {
    margin-top: 12px;
    font-size: clamp(13px, 2.6vw, 16px);
    opacity: .82;
    letter-spacing: 1px;
  }

  .grid {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 26px;
  }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: #fff;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 20px;
    padding: 30px 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
    transition: transform .25s ease, box-shadow .25s ease,
                background .25s ease, border-color .25s ease;
    overflow: hidden;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,.22), transparent 60%);
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }

  .card:hover,
  .card:focus-visible {
    transform: translateY(-8px);
    background: rgba(255, 255, 255, .2);
    border-color: rgba(255, 255, 255, .55);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .3);
    outline: none;
  }

  .card:hover::after { opacity: 1; }

  .icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 18px;
    background: rgba(255, 255, 255, .2);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3);
  }

  .card h2 {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: .5px;
  }

  .card p {
    font-size: 13.5px;
    line-height: 1.7;
    opacity: .8;
    word-break: break-all;
  }

  .arrow {
    position: absolute;
    top: 30px;
    right: 26px;
    font-size: 18px;
    opacity: .55;
    transition: transform .25s ease, opacity .25s ease;
  }

  .card:hover .arrow {
    transform: translate(4px, -4px);
    opacity: 1;
  }

  footer {
    margin-top: 48px;
    font-size: 12.5px;
    opacity: .55;
    letter-spacing: 1px;
    text-align: center;
  }

  @media (max-width: 420px) {
    .card { padding: 24px 20px; }
    .icon { width: 46px; height: 46px; font-size: 22px; margin-bottom: 14px; }
  }
</style>
</head>
<body>

  <header>
    <h1>物理仿真资源导航</h1>
    <p>点击下方卡片，在新标签页中打开对应网站</p>
  </header>

  <main class="grid">

    <!-- 卡片 1：PhET -->
    <a class="card"
       href="https://phet.colorado.edu/zh_CN/"
       target="_blank" rel="noopener noreferrer">
      <span class="arrow">↗</span>
      <div class="icon">🔬</div>
      <h2>PhET 中文主页</h2>
      <p>phet.colorado.edu/zh_CN<br>科罗拉多大学互动仿真 · 物理 / 化学 / 数学</p>
    </a>

    <!-- 卡片 2：physicstjc -->
    <a class="card"
       href="https://physicstjc.github.io/sls/simulations/index.html"
       target="_blank" rel="noopener noreferrer">
      <span class="arrow">↗</span>
      <div class="icon">🧭</div>
      <h2>physicstjc 物理仿真合集</h2>
      <p>physicstjc.github.io/sls/simulations<br>物理教学仿真演示合集主页</p>
    </a>

    <!--
      ▼ 需要新增网站时，复制下面这段改一改即可：

      <a class="card" href="你的网址" target="_blank" rel="noopener noreferrer">
        <span class="arrow">↗</span>
        <div class="icon">📘</div>
        <h2>网站名称</h2>
        <p>网址或简介</p>
      </a>
    -->

  </main>

  <footer>© 物理仿真资源导航</footer>

</body>
</html>
