<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面积法推导 · 初速度为零的匀加速直线运动</title>
<style>
:root{
  --bg:#070d18;
  --line:#1e3049;
  --text:#e6eefc;
  --muted:#8ba0bd;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1100px 560px at 15% -10%, #16253c 0%, #070d18 60%), #070d18;
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  min-height:100vh;
  padding:14px 18px 26px;
}
header{max-width:1720px;margin:0 auto 10px;}
header h1{
  font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(90deg,#38bdf8,#a78bfa,#fbbf24);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header .sub{font-size:12.5px;color:var(--muted);margin:0;}

.mode-switch{display:flex;gap:10px;flex-wrap:wrap;max-width:1720px;margin:0 auto 10px;}
.mode-btn{
  padding:9px 18px;border-radius:11px;cursor:pointer;
  background:#0f1b2c;border:1px solid #223550;color:#9fb4d0;
  font-size:13.5px;font-weight:600;font-family:inherit;transition:.18s;
}
.mode-btn:hover{background:#16253c;color:#dbe8fb;}
.mode-btn.active{
  background:linear-gradient(180deg,#0ea5e9,#0369a1);
  border-color:#38bdf8;color:#fff;
  box-shadow:0 5px 18px rgba(14,165,233,.35);
}

.controls{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  max-width:1720px;margin:0 auto 12px;
  background:#0d1726;border:1px solid #1e3049;border-radius:11px;
  padding:9px 16px;
}
.controls label{font-size:12.5px;color:var(--muted);white-space:nowrap;}
.controls input[type=range]{
  flex:0 1 180px;-webkit-appearance:none;height:5px;border-radius:3px;
  background:#1e3049;outline:none;
}
.controls input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#e2e8f0;border:3px solid #38bdf8;cursor:pointer;
  box-shadow:0 0 9px rgba(56,189,248,.75);
}
.controls input[type=range].amber::-webkit-slider-thumb{
  border-color:#fbbf24;box-shadow:0 0 9px rgba(251,191,36,.75);
}
.controls .nval{
  font-size:14px;font-weight:700;color:#38bdf8;
  font-variant-numeric:tabular-nums;min-width:24px;text-align:center;
}
.controls .aval{
  font-size:14px;font-weight:700;color:#fbbf24;
  font-variant-numeric:tabular-nums;min-width:30px;text-align:center;
}
.controls .divider{width:1px;height:22px;background:#1e3049;margin:0 4px;}
.controls .hint{font-size:11.5px;color:#5f7593;margin-left:auto;}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,0.88fr);
  gap:14px;max-width:1720px;margin:0 auto;align-items:start;
}
@media (max-width:1080px){ .layout{grid-template-columns:1fr;} }

.card{
  background:linear-gradient(180deg,#101c2e,#0c1524);
  border:1px solid var(--line);border-radius:15px;
  box-shadow:0 12px 36px rgba(0,0,0,.42);overflow:hidden;
}
.card-hd{
  padding:9px 16px;font-size:12px;font-weight:600;color:#cfe0f7;
  border-bottom:1px solid var(--line);letter-spacing:.6px;
  display:flex;align-items:center;gap:8px;
}
.card-hd .dot{width:7px;height:7px;border-radius:50%;background:#38bdf8;box-shadow:0 0 9px #38bdf8;flex:none;}
canvas{display:block;width:100%;}

.panel{padding:16px 18px 20px;}
.panel h2{font-size:15.5px;margin:0 0 12px;color:#e6eefc;font-weight:700;letter-spacing:.4px;}
.panel p.lead{font-size:12.8px;line-height:1.78;color:#a9bcd6;margin:0 0 12px;}
.panel p.lead b{color:#7dd3fc;font-weight:700;}

.eq{
  background:#0a1424;border:1px solid #1c2f47;border-left:3px solid #38bdf8;
  border-radius:9px;padding:11px 14px;font-size:13px;color:#dbe8fb;
  line-height:1.85;margin:0 0 14px;
  font-family:"Cambria Math","Times New Roman",serif;letter-spacing:.3px;overflow-x:auto;
}
.eq sub{font-size:.72em;}

.concl{
  background:linear-gradient(90deg,rgba(52,211,153,.13),rgba(52,211,153,.02));
  border:1px solid rgba(52,211,153,.35);border-radius:10px;
  padding:11px 14px;font-size:13.5px;color:#6ee7b7;font-weight:700;
  margin:0 0 16px;letter-spacing:.4px;
  font-family:"Cambria Math","Times New Roman",serif;
}

.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.bar-row{display:flex;align-items:center;gap:9px;}
.bar-row .bl{
  width:42px;font-size:12px;color:#8ba0bd;text-align:right;
  font-family:"Cambria Math","Times New Roman",serif;flex:none;
}
.bar-row .btrack{
  flex:1;height:17px;background:#0a1424;border-radius:5px;overflow:hidden;
  border:1px solid #1a2b40;
}
.bar-row .bfill{height:100%;border-radius:4px;transition:width .3s ease;}
.bar-row .bv{
  width:70px;font-size:12px;color:#dbe8fb;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:right;flex:none;
}

.tip{
  font-size:11.5px;color:#6b809d;line-height:1.72;
  border-top:1px dashed #1e3049;padding-top:11px;margin-top:16px;
}
.tip b{color:#a78bfa;}
</style>
</head>
<body>

<header>
  <h1>面积法推导 · 初速度为零的匀加速直线运动</h1>
  <p class="sub">v–t 图像下方的面积 = 位移。用全等三角形拼图，一眼看出 1 : 3 : 5 : 7 …</p>
</header>

<div class="mode-switch">
  <button class="mode-btn active" data-mode="time">① 相同时间内位移之比　1 : 3 : 5 : 7 …（用三角形拼）</button>
  <button class="mode-btn" data-mode="disp">② 相同位移内时间之比　1 : (√2−1) : (√3−√2) …</button>
</div>

<div class="controls">
  <label>分段数 n</label>
  <input type="range" id="nSlider" min="3" max="7" step="1" value="5">
  <span class="nval" id="nVal">5</span>
  <div class="divider"></div>
  <label>斜率 a</label>
  <input type="range" id="aSlider" class="amber" min="0.4" max="2.5" step="0.1" value="1">
  <span class="aval" id="aVal">1.0</span>
  <span class="hint">拖动滑块，改变分段数与斜率</span>
</div>

<div class="layout">
  <div class="card">
    <div class="card-hd"><span class="dot"></span>v – t 图像 · 面积分割</div>
    <canvas id="cv"></canvas>
  </div>

  <div class="card">
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   状态
   ============================================================ */
const state = { mode: 'time', n: 5, a: 1 };

/* 每块的基础色 [浅, 深] */
const PALETTE = [
  ['#7dd3fc', '#0284c7'],
  ['#6ee7b7', '#059669'],
  ['#fcd34d', '#d97706'],
  ['#fdba74', '#ea580c'],
  ['#f9a8d4', '#db2777'],
  ['#c4b5fd', '#7c3aed'],
  ['#67e8f9', '#0891b2']
];

/* ============================================================
   画布
   ============================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 800, H = 500;
const PAD = { l: 58, r: 32, t: 46, b: 58 };

function setupCanvas(){
  const rect = cv.parentElement.getBoundingClientRect();
  W = Math.max(320, rect.width);
  H = Math.round(Math.min(560, Math.max(370, W * 0.64)));

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ============================================================
   工具
   ============================================================ */
function hexA(hex, alpha){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function roundedRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function niceStep(raw){
  if (raw <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  let s;
  if (n <= 1) s = 1;
  else if (n <= 2) s = 2;
  else if (n <= 5) s = 5;
  else s = 10;
  return s * mag;
}

function niceTicks(min, max, count){
  const step = niceStep((max - min) / count);
  const out = [];
  for (let v = Math.ceil(min/step)*step; v <= max + step*1e-6; v += step){
    out.push(Math.abs(v) < step*1e-6 ? 0 : v);
  }
  return { ticks: out, step };
}

/* ============================================================
   核心：把第 k 个梯形分成 (2k−1) 个全等三角形
   ============================================================ */
function trapezoidTriangles(k, a, T, X, Y){
  const x0 = X((k-1)*T);
  const x1 = X(k*T);
  const yB = Y(0);

  const tris = [];

  if (k === 1){
    // 就是一个小三角形
    tris.push([[x0, yB], [x1, yB], [x1, Y(a*T)]]);
  } else {
    // 顶部一个小三角形
    const yTL = Y((k-1)*a*T);
    const yTR = Y(k*a*T);
    tris.push([[x0, yTL], [x1, yTR], [x1, yTL]]);

    // 下方矩形区切成 (k−1) 条水平带，每带再切成 2 个三角形
    for (let i = 0; i < k-1; i++){
      const yLo = Y(i*a*T);
      const yHi = Y((i+1)*a*T);
      // 三角形 A
      tris.push([[x0, yLo], [x1, yHi], [x0, yHi]]);
      // 三角形 B
      tris.push([[x0, yLo], [x1, yLo], [x1, yHi]]);
    }
  }
  return tris;
}

/* ============================================================
   绘制
   ============================================================ */
function draw(){
  const a = state.a;
  const n = state.n;
  const mode = state.mode;
  const T = 1;

  ctx.clearRect(0, 0, W, H);

  /* 背景 */
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d1828');
  bg.addColorStop(1, '#091120');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* ---------- 分割点 ---------- */
  let edges = [];
  const areas = [];

  if (mode === 'time'){
    for (let k = 0; k <= n; k++) edges.push(k * T);
    for (let k = 1; k <= n; k++){
      areas.push(0.5*a*edges[k]*edges[k] - 0.5*a*edges[k-1]*edges[k-1]);
    }
  } else {
    for (let k = 0; k <= n; k++) edges.push(Math.sqrt(2*k*1/a));
    for (let k = 1; k <= n; k++) areas.push(1);
  }

  const tmax = edges[n];
  const vmaxActual = a * tmax;

  /* ---------- 坐标轴范围 ---------- */
  let xAxisMax, vAxisMax;
  if (mode === 'time'){
    xAxisMax = n * 1.06;
    vAxisMax = Math.max(6, a * n * 1.10);
  } else {
    xAxisMax = tmax * 1.08;
    vAxisMax = Math.max(4, vmaxActual * 1.14);
  }

  const plotL = PAD.l;
  const plotR = W - PAD.r;
  const plotT = PAD.t;
  const plotB = H - (mode === 'time' ? PAD.b : PAD.b + 40);
  const plotW = plotR - plotL;
  const plotH = plotB - plotT;

  const X = t => plotL + (t / xAxisMax) * plotW;
  const Y = v => plotB - (v / vAxisMax) * plotH;

  /* ---------- 水平网格 ---------- */
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui, -apple-system, sans-serif';

  const ty = niceTicks(0, vAxisMax, 5);
  ty.ticks.forEach(v => {
    if (v === 0) return;
    const y = Y(v);
    ctx.strokeStyle = 'rgba(148,163,184,0.08)';
    ctx.beginPath();
    ctx.moveTo(plotL, y);
    ctx.lineTo(plotR, y);
    ctx.stroke();

    ctx.fillStyle = '#6d84a3';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(v.toFixed(0), plotL - 10, y);
  });

  /* ============================================================
     模式一：三角形拼图
     ============================================================ */
  if (mode === 'time'){
    for (let k = 1; k <= n; k++){
      const [cLight, cDark] = PALETTE[(k-1) % PALETTE.length];
      const tris = trapezoidTriangles(k, a, T, X, Y);

      tris.forEach((tri, idx) => {
        ctx.beginPath();
        ctx.moveTo(tri[0][0], tri[0][1]);
        ctx.lineTo(tri[1][0], tri[1][1]);
        ctx.lineTo(tri[2][0], tri[2][1]);
        ctx.closePath();

        /* 明暗交替，让每个三角形清晰可数 */
        const even = (idx % 2 === 0);
        const grad = ctx.createLinearGradient(tri[0][0], tri[0][1], tri[2][0], tri[2][1]);
        grad.addColorStop(0, hexA(cLight, even ? 0.85 : 0.55));
        grad.addColorStop(1, hexA(cDark,  even ? 0.65 : 0.40));
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 0.9;
        ctx.stroke();
      });
    }

    /* 竖直分割虚线（画在三角形上面，强调时间分段） */
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.2;
    for (let k = 1; k < n; k++){
      const x = X(k * T);
      ctx.beginPath();
      ctx.moveTo(x, plotB);
      ctx.lineTo(x, Y(a * k * T));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ============================================================
     模式二：等面积分割
     ============================================================ */
  if (mode === 'disp'){
    for (let k = 1; k <= n; k++){
      const e0 = edges[k-1];
      const e1 = edges[k];
      const x0 = X(e0);
      const x1 = X(e1);
      const yTop0 = Y(a * e0);
      const yTop1 = Y(a * e1);
      const yB = Y(0);

      const [cLight, cDark] = PALETTE[(k-1) % PALETTE.length];
      const grad = ctx.createLinearGradient(0, Math.min(yTop0, yTop1), 0, yB);
      grad.addColorStop(0, hexA(cLight, 0.78));
      grad.addColorStop(1, hexA(cDark, 0.22));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x0, yB);
      ctx.lineTo(x0, yTop0);
      ctx.lineTo(x1, yTop1);
      ctx.lineTo(x1, yB);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = hexA(cLight, 0.5);
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }

    /* 竖直分割虚线 */
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(226,232,240,0.38)';
    ctx.lineWidth = 1.2;
    for (let k = 1; k < n; k++){
      const x = X(edges[k]);
      ctx.beginPath();
      ctx.moveTo(x, plotB);
      ctx.lineTo(x, Y(a * edges[k]));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 斜线 v = at ---------- */
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0));
  ctx.lineTo(X(tmax), Y(vmaxActual));
  ctx.strokeStyle = '#e8f2ff';
  ctx.lineWidth = 2.9;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(125,211,252,0.8)';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* ---------- 坐标轴 ---------- */
  ctx.strokeStyle = '#41597a';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(plotL, plotT - 8);
  ctx.lineTo(plotL, plotB);
  ctx.lineTo(plotR + 8, plotB);
  ctx.stroke();

  ctx.fillStyle = '#41597a';
  ctx.beginPath();
  ctx.moveTo(plotL, plotT - 14);
  ctx.lineTo(plotL - 5, plotT - 5);
  ctx.lineTo(plotL + 5, plotT - 5);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(plotR + 14, plotB);
  ctx.lineTo(plotR + 5, plotB - 5);
  ctx.lineTo(plotR + 5, plotB + 5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#8ba0bd';
  ctx.font = 'italic 13px "Cambria Math","Times New Roman",serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('v/(m·s⁻¹)', plotL - 12, plotT - 34);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('t/s', plotR + 4, plotB + 10);

  /* ---------- x 轴刻度 ---------- */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  if (mode === 'time'){
    for (let k = 1; k <= n; k++){
      const x = X(edges[k]);
      ctx.font = '12px "Cambria Math","Times New Roman",serif';
      ctx.fillStyle = '#8ba0bd';
      ctx.fillText(k === 1 ? 'T' : k + 'T', x, plotB + 10);

      ctx.strokeStyle = '#41597a';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x, plotB);
      ctx.lineTo(x, plotB + 6);
      ctx.stroke();
    }
  } else {
    for (let k = 1; k <= n; k++){
      const x = X(edges[k]);
      ctx.font = '11px "Cambria Math","Times New Roman",serif';
      ctx.fillStyle = '#8ba0bd';
      ctx.fillText('t' + k, x, plotB + 10);
      ctx.strokeStyle = '#41597a';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x, plotB);
      ctx.lineTo(x, plotB + 6);
      ctx.stroke();
    }
    ctx.fillStyle = '#8ba0bd';
    ctx.font = '11px sans-serif';
    ctx.fillText('O', X(0) - 4, plotB + 10);
  }

  /* ---------- 每块中央的"数字徽章" ---------- */
  for (let k = 1; k <= n; k++){
    const e0 = edges[k-1];
    const e1 = edges[k];
    const x0 = X(e0);
    const x1 = X(e1);
    const yTop0 = Y(a * e0);
    const yTop1 = Y(a * e1);
    const yB = Y(0);

    const cx = (x0 + x1) / 2;
    const cyTop = (yTop0 + yTop1) / 2;
    const cy = (yB + cyTop) / 2;

    const text = (mode === 'time') ? String(2*k - 1) : 's';

    ctx.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(text).width;
    const bw = tw + 20;
    const bh = 22;

    ctx.beginPath();
    roundedRect(ctx, cx - bw/2, cy - bh/2, bw, bh, 11);
    ctx.fillStyle = 'rgba(7,13,24,0.82)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.42)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy + 0.5);
  }

  /* ---------- 图像顶部注记 ---------- */
  ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  if (mode === 'time'){
    ctx.fillStyle = '#7dd3fc';
    ctx.fillText('每个小三角形面积都 = S = ½aT²，第 k 段里恰好有 (2k−1) 个 → 位移比 1 : 3 : 5 : 7 …', plotL + 6, plotT - 30);
  } else {
    ctx.fillStyle = '#6ee7b7';
    ctx.fillText('每块面积都 = s，但水平宽度（时间）越来越窄 → Δt 比 1 : (√2−1) : (√3−√2) : …', plotL + 6, plotT - 30);
  }

  /* ============================================================
     模式二：x 轴下方的"时间宽度条"
     ============================================================ */
  if (mode === 'disp'){
    const barTop = plotB + 26;
    const barH = 16;
    for (let k = 1; k <= n; k++){
      const x0 = X(edges[k-1]);
      const x1 = X(edges[k]);
      const bw = Math.max(2, x1 - x0);
      const [cLight] = PALETTE[(k-1) % PALETTE.length];

      ctx.fillStyle = hexA(cLight, 0.75);
      roundedRect(ctx, x0, barTop, bw, barH, 3);
      ctx.fill();

      if (bw > 16){
        ctx.font = '600 10px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#0a1424';
        ctx.fillText('Δt' + k, x0 + bw/2, barTop + barH/2 + 0.5);
      }
    }
    ctx.font = '10.5px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#5f7593';
    ctx.fillText('↓ 面积相同，宽度越来越窄', plotL, barTop + barH + 16);
  }

  /* ---------- 原点 ---------- */
  ctx.beginPath();
  ctx.arc(X(0), Y(0), 3.5, 0, Math.PI * 2);
  ctx.fillStyle = '#8ba0bd';
  ctx.fill();
}

/* ============================================================
   右侧面板
   ============================================================ */
const panel = document.getElementById('panel');

function updatePanel(){
  const n = state.n;
  const mode = state.mode;
  let html = '';

  /* ================= 模式一 ================= */
  if (mode === 'time'){
    html += `<h2>① 相同时间内位移之比</h2>`;

    html += `<p class="lead">
      把总时间等分成 <b>${n}</b> 段，每段为 <b>T</b>。
      图像里的每个小三角形面积都是 <b>S = ½aT²</b>——
      把每个梯形都用这种小三角形拼出来，数一数个数，比例就出来了。
    </p>`;

    html += `<div class="eq">
      第 k 段位移：<br>
      x<sub>k</sub> = ½a(kT)² − ½a[(k−1)T]²<br>
      &nbsp;&nbsp;&nbsp;= ½aT²·(2k−1)<br>
      &nbsp;&nbsp;&nbsp;= S·(2k−1)
    </div>`;

    html += `<p class="lead">图上每块里三角形的个数：</p>`;

    const vals = [];
    for (let k = 1; k <= n; k++) vals.push(2*k - 1);
    const maxVal = Math.max(...vals);

    html += `<div class="bars">`;
    for (let k = 1; k <= n; k++){
      const v = 2*k - 1;
      const [cLight] = PALETTE[(k-1) % PALETTE.length];
      const pct = (v / maxVal * 100).toFixed(1);
      html += `
        <div class="bar-row">
          <span class="bl">x<sub>${k}</sub></span>
          <div class="btrack">
            <div class="bfill" style="width:${pct}%;background:linear-gradient(90deg,${cLight},${cLight}88)"></div>
          </div>
          <span class="bv">${v} 个</span>
        </div>`;
    }
    html += `</div>`;

    html += `<div class="concl" style="margin-top:16px">
      x₁ : x₂ : x₃ : … = 1 : 3 : 5 : … : (2n−1)
    </div>`;

    html += `<div class="tip">
      <b>图上怎么数？</b><br>
      每个梯形里都铺着全等的小三角形（面积都等于 S）：<br>
      · 第 1 段 → 1 个<br>
      · 第 2 段 → 3 个<br>
      · 第 3 段 → 5 个<br>
      · 第 4 段 → 7 个 ……<br>
      拖动斜率 a：所有三角形按同一比例缩放，但<b>个数不变</b>，比例关系始终成立。
    </div>`;
  }

  /* ================= 模式二 ================= */
  else {
    html += `<h2>② 相同位移内时间之比</h2>`;

    html += `<p class="lead">
      把总位移等分成 <b>${n}</b> 段，每段为 <b>s</b>。
      在 v–t 图像中就是把三角形<b>等面积分割</b>——
      每块面积相同，但水平宽度（时间）越来越窄。
    </p>`;

    html += `<div class="eq">
      前 k 段位移之和 = ks：<br>
      ½at<sub>k</sub>² = ks &nbsp;⟹&nbsp; t<sub>k</sub> = √(2ks/a)<br><br>
      第 k 段所用时间：<br>
      Δt<sub>k</sub> = t<sub>k</sub> − t<sub>k−1</sub><br>
      &nbsp;&nbsp;&nbsp;&nbsp; = √(2s/a)·(√k − √(k−1))
    </div>`;

    html += `<p class="lead">各段所用时间之比：</p>`;

    const vals = [];
    for (let k = 1; k <= n; k++) vals.push(Math.sqrt(k) - Math.sqrt(k-1));
    const maxVal = Math.max(...vals);

    html += `<div class="bars">`;
    for (let k = 1; k <= n; k++){
      const v = Math.sqrt(k) - Math.sqrt(k-1);
      const [cLight] = PALETTE[(k-1) % PALETTE.length];
      const pct = (v / maxVal * 100).toFixed(1);

      let niceLabel;
      if (k === 1) niceLabel = '1';
      else if (k === 2) niceLabel = '√2−1';
      else if (k === 3) niceLabel = '√3−√2';
      else if (k === 4) niceLabel = '2−√3';
      else niceLabel = '√' + k + '−√' + (k-1);

      html += `
        <div class="bar-row">
          <span class="bl">Δt<sub>${k}</sub></span>
          <div class="btrack">
            <div class="bfill" style="width:${pct}%;background:linear-gradient(90deg,${cLight},${cLight}88)"></div>
          </div>
          <span class="bv">${v.toFixed(3)}</span>
        </div>`;
    }
    html += `</div>`;

    html += `<div class="concl" style="margin-top:16px">
      Δt₁ : Δt₂ : Δt₃ : … = 1 : (√2−1) : (√3−√2) : …
    </div>`;

    html += `<div class="tip">
      <b>图上怎么看？</b><br>
      竖直虚线把三角形切成了 ${n} 块<b>面积相等</b>的小块（每块 = s）。<br>
      越往右，每块的<b>水平宽度越来越窄</b>——速度越来越大，
      用同样的位移当然花的时间更短。<br>
      x 轴下方的彩色条直观对比了每段的实际时间宽度。<br><br>
      <b>为什么有根号差？</b><br>
      前 k 段总时间 t<sub>k</sub> = √(2ks/a)，第 k 段时间 = 两个根号相减，
      提出公因子 √(2s/a) 后剩下 √k − √(k−1)。
    </div>`;
  }

  panel.innerHTML = html;
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  setupCanvas();
  draw();
  updatePanel();
}

/* ============================================================
   事件
   ============================================================ */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    render();
  });
});

const nSlider = document.getElementById('nSlider');
const nVal = document.getElementById('nVal');
nSlider.addEventListener('input', () => {
  state.n = parseInt(nSlider.value, 10);
  nVal.textContent = state.n;
  render();
});

const aSlider = document.getElementById('aSlider');
const aVal = document.getElementById('aVal');
aSlider.addEventListener('input', () => {
  state.a = parseFloat(aSlider.value);
  aVal.textContent = state.a.toFixed(1);
  render();
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

/* ============================================================
   启动
   ============================================================ */
requestAnimationFrame(() => {
  render();
});
</script>
</body>
</html>
