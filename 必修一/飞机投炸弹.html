<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一架飞机连续投弹 · 参考系对比</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #0b121f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1260px;
            width: 100%;
            background: linear-gradient(145deg, #141e30, #1a2a40);
            border-radius: 32px;
            padding: 24px 28px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e8edf5;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 small {
            font-size: 0.85rem;
            font-weight: 400;
            color: #8aa3c9;
        }
        .header .badge {
            background: #2a4a7a;
            color: #b6d0f0;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid #3a6a9a;
        }

        .canvas-wrapper {
            background: #0a111f;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #2a3a5a;
            position: relative;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0a111f;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            padding: 10px 16px 6px;
            background: #0e1729;
            border-radius: 0 0 20px 20px;
            border-top: 1px solid #1f2f4a;
            font-size: 0.82rem;
            color: #b0c8e8;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-item .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .legend-item .line-sample {
            width: 22px;
            height: 3px;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-top: 16px;
            padding: 14px 18px;
            background: #0e1729;
            border-radius: 18px;
            border: 1px solid #1f2f4a;
            align-items: center;
        }
        .controls .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            background: #1f3150;
            border: none;
            color: #d0def0;
            padding: 7px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #2f4a6a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .btn:hover {
            background: #2a4068;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: #2a6a9a;
            border-color: #3a8aba;
            color: #fff;
            box-shadow: 0 4px 16px rgba(42, 106, 154, 0.35);
        }
        .btn-primary:hover {
            background: #3a7aaa;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #1f8a4a;
            border-color: #2aaa5a;
            color: #fff;
        }
        .btn-success:hover {
            background: #2a9a5a;
        }
        .btn-danger {
            background: #8a2a2a;
            border-color: #aa3a3a;
            color: #fff;
        }
        .btn-danger:hover {
            background: #9a3a3a;
        }
        .btn-outline {
            background: transparent;
            border-color: #3a5a7a;
            color: #90b0d0;
        }
        .btn-outline:hover {
            background: #1a2a40;
            border-color: #5a7a9a;
        }

        .controls .slider-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .controls .slider-group label {
            color: #90b0d0;
            font-size: 0.78rem;
            font-weight: 500;
        }
        .controls .slider-group input[type="range"] {
            width: 68px;
            accent-color: #3a8aba;
            background: #1a2a3a;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls .slider-group .val {
            color: #d0def0;
            font-weight: 600;
            min-width: 26px;
            text-align: center;
            font-size: 0.82rem;
        }
        .controls .status {
            color: #8aaac8;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .controls .status .pulse {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #4a8a4a;
            transition: background 0.3s;
        }
        .controls .status .pulse.paused {
            background: #8a7a3a;
        }
        .controls .status .pulse.idle {
            background: #5a5a6a;
        }
        .controls .status .pulse.dropping {
            background: #f0c050;
            animation: blink 0.6s infinite alternate;
        }
        @keyframes blink {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 1;
            }
        }

        @media (max-width: 820px) {
            .container {
                padding: 14px;
            }
            .header h1 {
                font-size: 1.1rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .slider-group {
                justify-content: space-between;
            }
            .controls .btn-group {
                justify-content: center;
            }
            .controls .status {
                justify-content: center;
                margin-left: 0;
            }
            .legend {
                font-size: 0.7rem;
                gap: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>
                ✈️ 一架飞机 · 连续投弹
                <small>两种参考系 · 无空气阻力</small>
            </h1>
            <span class="badge">⚡ 同一架飞机 · 两种视角</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="simCanvas" width="1240" height="640"></canvas>
            <div class="legend">
                <span class="legend-item">
                    <span class="dot" style="background:#f0c050;border-color:#f0c050;"></span>
                    炸弹 (飞机参考系)
                </span>
                <span class="legend-item">
                    <span class="dot" style="background:#50b0f0;border-color:#50b0f0;"></span>
                    炸弹 (地面参考系)
                </span>
                <span class="legend-item">
                    <span class="line-sample" style="background:#f0c050;opacity:0.5;"></span>
                    轨迹 (飞机参考系 · 竖直)
                </span>
                <span class="legend-item">
                    <span class="line-sample" style="background:#50b0f0;opacity:0.5;"></span>
                    轨迹 (地面参考系 · 抛物线)
                </span>
                <span class="legend-item" style="margin-left:auto;">
                    <span style="opacity:0.6;">✈️ 飞机</span>
                    <span style="opacity:0.6;margin-left:12px;">💥 炸弹 × <span id="bombCountDisplay">0</span></span>
                </span>
            </div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-success" id="btnDrop">💣 投弹</button>
                <button class="btn btn-primary" id="btnContinuous">🔁 连续投弹</button>
                <button class="btn btn-outline" id="btnPause">⏸️ 暂停</button>
                <button class="btn btn-outline" id="btnReset">🔄 重置</button>
                <button class="btn btn-outline" id="btnTrajectory">📐 轨迹</button>
            </div>

            <div class="slider-group">
                <label>速度</label>
                <input type="range" id="speedSlider" min="0.5" max="5.0" step="0.25" value="2.0" />
                <span class="val" id="speedVal">2.0</span>

                <label style="margin-left:4px;">高度</label>
                <input type="range" id="heightSlider" min="160" max="500" step="10" value="320" />
                <span class="val" id="heightVal">320</span>

                <label style="margin-left:4px;">间隔</label>
                <input type="range" id="intervalSlider" min="0.05" max="2.0" step="0.02" value="0.30" />
                <span class="val" id="intervalVal">0.30s</span>

                <label style="margin-left:4px;">模拟</label>
                <input type="range" id="speedScaleSlider" min="0.05" max="0.8" step="0.05" value="0.35" />
                <span class="val" id="speedScaleVal">0.35</span>
            </div>

            <div class="status">
                <span class="pulse idle" id="statusPulse"></span>
                <span id="statusText">就绪</span>
            </div>
        </div>
    </div>

    <script>
        // =============================================================
        //  一架飞机连续投弹 · 物理模拟 (无空气阻力)
        //  同一架飞机，同时展示两种参考系下的运动
        //  飞机参考系：炸弹竖直下落（黄色）
        //  地面参考系：炸弹平抛运动（蓝色）
        //  核心规律：炸弹始终在飞机正下方
        // =============================================================

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const W = 1240,
            H = 640;
        canvas.width = W;
        canvas.height = H;

        // ---- 物理参数 ----
        const GRAVITY = 0.32;
        const GROUND_Y = 572;
        const MAX_BOMBS = 300;
        const MAX_TRAIL = 150;

        // ---- 状态 ----
        let state = {
            // 飞机 (唯一)
            planeX: 80,
            planeY: 320,
            planeV: 2.0,
            timeScale: 0.35,

            bombs: [],
            bombIdCounter: 0,

            showTrail: true,
            paused: false,

            continuousMode: false,
            dropInterval: 0.30,
            dropTimer: 0,

            totalDropped: 0,
            activeBombs: 0,

            // 用于显示参考系对比的固定点
            refX: 310, // 飞机参考系中飞机的固定位置
        };

        // ---- DOM ----
        const btnDrop = document.getElementById('btnDrop');
        const btnContinuous = document.getElementById('btnContinuous');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const btnTrajectory = document.getElementById('btnTrajectory');
        const speedSlider = document.getElementById('speedSlider');
        const heightSlider = document.getElementById('heightSlider');
        const intervalSlider = document.getElementById('intervalSlider');
        const speedScaleSlider = document.getElementById('speedScaleSlider');
        const speedVal = document.getElementById('speedVal');
        const heightVal = document.getElementById('heightVal');
        const intervalVal = document.getElementById('intervalVal');
        const speedScaleVal = document.getElementById('speedScaleVal');
        const statusText = document.getElementById('statusText');
        const statusPulse = document.getElementById('statusPulse');
        const bombCountDisplay = document.getElementById('bombCountDisplay');

        // ---- 创建炸弹 ----
        function createBomb(x, y, vx) {
            return {
                id: state.bombIdCounter++,
                x: x,
                y: y,
                vx: vx,
                vy: 0,
                active: true,
                landed: false,
                trailGround: [],
                maxFall: 0,
                dropTime: performance.now(),
            };
        }

        // ---- 投弹 ----
        function dropBomb() {
            if (state.bombs.length >= MAX_BOMBS) {
                const oldest = state.bombs.reduce((a, b) => a.dropTime < b.dropTime ? a : b);
                const idx = state.bombs.indexOf(oldest);
                if (idx !== -1) state.bombs.splice(idx, 1);
            }

            const px = state.planeX;
            const py = state.planeY;
            const bomb = createBomb(px, py, state.planeV);
            state.bombs.push(bomb);
            state.totalDropped++;
            updateBombCount();
            return bomb;
        }

        // ---- 重置 ----
        function resetSim(keepTrailSetting = true) {
            state.planeX = 80;
            state.planeY = parseInt(heightSlider.value);
            state.planeV = parseFloat(speedSlider.value);
            state.bombs = [];
            state.bombIdCounter = 0;
            state.totalDropped = 0;
            state.activeBombs = 0;
            state.dropTimer = 0;
            state.paused = false;
            state.continuousMode = false;
            btnContinuous.textContent = '🔁 连续投弹';
            btnContinuous.className = 'btn btn-primary';
            if (!keepTrailSetting) {
                state.showTrail = true;
                btnTrajectory.textContent = '📐 轨迹';
            }
            btnPause.textContent = '⏸️ 暂停';
            statusPulse.className = 'pulse idle';
            statusText.textContent = '就绪';
            btnDrop.disabled = false;
            updateBombCount();
            updateUI();
        }

        // ---- 物理更新 ----
        function updatePhysics() {
            if (state.paused) return;

            const ts = state.timeScale;

            // 飞机水平运动（唯一一架）
            state.planeX += state.planeV * ts;
            if (state.planeX > W + 80) {
                state.planeX = -80;
            }

            // ---- 连续投弹 ----
            if (state.continuousMode) {
                const intervalFrames = state.dropInterval * 60 / state.timeScale;
                state.dropTimer += 1;
                if (state.dropTimer >= intervalFrames) {
                    state.dropTimer = 0;
                    dropBomb();
                }
            }

            // ---- 更新所有炸弹 ----
            for (let i = 0; i < state.bombs.length; i++) {
                const b = state.bombs[i];
                if (!b.active && b.landed) continue;

                b.vy += GRAVITY * ts;
                b.x += b.vx * ts;
                b.y += b.vy * ts;

                if (state.showTrail) {
                    b.trailGround.push({ x: b.x, y: b.y });
                    if (b.trailGround.length > MAX_TRAIL) {
                        b.trailGround.shift();
                    }
                }

                const fall = state.planeY - b.y;
                if (fall > b.maxFall) b.maxFall = fall;

                if (b.y >= GROUND_Y - 6) {
                    b.y = GROUND_Y - 6;
                    b.active = false;
                    b.landed = true;
                }
            }

            // 限制炸弹数量
            if (state.bombs.length > MAX_BOMBS) {
                state.bombs.sort((a, b) => a.dropTime - b.dropTime);
                state.bombs.splice(0, state.bombs.length - MAX_BOMBS);
            }

            updateBombCount();
            updateUI();
        }

        // ---- 绘制 ----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ---- 背景 ----
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#050a18');
            skyGrad.addColorStop(0.3, '#0a1628');
            skyGrad.addColorStop(0.7, '#142442');
            skyGrad.addColorStop(1, '#0f1a30');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // 地面
            const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            groundGrad.addColorStop(0, '#2a3a2a');
            groundGrad.addColorStop(0.3, '#1a2a1a');
            groundGrad.addColorStop(1, '#0a120a');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

            ctx.strokeStyle = '#4a7a4a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();
            ctx.strokeStyle = '#2a4a2a';
            ctx.lineWidth = 1;
            ctx.setLineDash([8, 16]);
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y + 16);
            ctx.lineTo(W, GROUND_Y + 16);
            ctx.stroke();
            ctx.setLineDash([]);

            // ---- 分割线（视觉区分两种参考系） ----
            const midX = 620;
            ctx.save();
            ctx.strokeStyle = 'rgba(60, 90, 120, 0.25)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 10]);
            ctx.beginPath();
            ctx.moveTo(midX, 20);
            ctx.lineTo(midX, GROUND_Y - 10);
            ctx.stroke();
            ctx.setLineDash([]);
            // 分割标签
            ctx.fillStyle = 'rgba(60, 90, 120, 0.2)';
            ctx.font = '11px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('┃ 参考系对比 ┃', midX, GROUND_Y - 30);
            ctx.restore();

            // ========================================
            //  左侧：飞机参考系
            //  飞机静止，炸弹竖直下落
            // ========================================
            const refX = state.refX;
            const refY = state.planeY;

            // 飞机参考系中的飞机（静止，半透明灰色）
            drawPlane(ctx, refX, refY, 0.85, '#7a8a9a', 0.5);

            // 标注 "参考系飞机（静止）"
            ctx.save();
            ctx.fillStyle = 'rgba(180, 200, 220, 0.3)';
            ctx.font = '10px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('参考系飞机（静止）', refX, refY - 36);
            ctx.restore();

            // ---- 轨迹 (飞机参考系) ----
            if (state.showTrail) {
                for (const b of state.bombs) {
                    if (b.trailGround.length < 2) continue;
                    const trail = b.trailGround.map(p => ({
                        x: refX + (p.x - state.planeX),
                        y: refY + (p.y - state.planeY)
                    }));
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(240, 192, 80, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(240, 192, 80, 0.15)';
                    ctx.moveTo(trail[0].x, trail[0].y);
                    for (let i = 1; i < trail.length; i++) {
                        ctx.lineTo(trail[i].x, trail[i].y);
                    }
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            }

            // ---- 炸弹 (飞机参考系) ----
            for (const b of state.bombs) {
                const bx = refX + (b.x - state.planeX);
                const by = refY + (b.y - state.planeY);
                if (bx < -50 || bx > W + 50 || by < -50 || by > GROUND_Y + 20) continue;
                const alpha = b.active ? 1.0 : 0.4;
                const size = b.active ? 9 : 6;
                drawBomb(ctx, bx, by, '#f0c050', `rgba(240, 192, 80, ${0.2 * alpha})`, alpha, size);
            }

            // 左侧标注
            ctx.save();
            ctx.fillStyle = 'rgba(240, 192, 80, 0.9)';
            ctx.font = 'bold 14px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('📐 飞机参考系', 20, 16);
            ctx.fillStyle = 'rgba(200, 180, 140, 0.5)';
            ctx.font = '11px "Segoe UI", sans-serif';
            ctx.fillText('(炸弹竖直下落 · 轨迹为竖直线)', 20, 38);
            ctx.restore();

            // ========================================
            //  右侧：地面参考系
            //  飞机运动，炸弹平抛
            // ========================================
            const px = state.planeX;
            const py = state.planeY;

            // 地面参考系中的飞机（运动，彩色）
            drawPlane(ctx, px, py, 0.85, '#50b0f0', 1.0);

            // ---- 轨迹 (地面参考系) ----
            if (state.showTrail) {
                for (const b of state.bombs) {
                    if (b.trailGround.length < 2) continue;
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(80, 176, 240, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(80, 176, 240, 0.15)';
                    ctx.moveTo(b.trailGround[0].x, b.trailGround[0].y);
                    for (let i = 1; i < b.trailGround.length; i++) {
                        ctx.lineTo(b.trailGround[i].x, b.trailGround[i].y);
                    }
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            }

            // ---- 炸弹 (地面参考系) ----
            for (const b of state.bombs) {
                if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > GROUND_Y + 20) continue;
                const alpha = b.active ? 1.0 : 0.4;
                const size = b.active ? 9 : 6;
                drawBomb(ctx, b.x, b.y, '#50b0f0', `rgba(80, 176, 240, ${0.2 * alpha})`, alpha, size);
            }

            // ---- 垂直虚线：飞机 → 炸弹（地面参考系） ----
            if (state.bombs.length > 0) {
                const activeBombs = state.bombs.filter(b => b.active);
                if (activeBombs.length > 0) {
                    const latest = activeBombs.reduce((a, b) => a.dropTime > b.dropTime ? a : b);
                    const by = latest.y;
                    if (by < GROUND_Y - 10) {
                        ctx.save();
                        ctx.setLineDash([4, 6]);
                        ctx.strokeStyle = 'rgba(80, 176, 240, 0.2)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(px, py + 8);
                        ctx.lineTo(px, Math.min(by, GROUND_Y - 4));
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.restore();
                        ctx.save();
                        ctx.fillStyle = 'rgba(80, 176, 240, 0.25)';
                        ctx.font = '10px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText('始终在正下方', px, Math.min(by, GROUND_Y - 4) - 4);
                        ctx.restore();
                    }
                }
            }

            // 右侧标注
            ctx.save();
            ctx.fillStyle = 'rgba(80, 176, 240, 0.9)';
            ctx.font = 'bold 14px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText('🌍 地面参考系', W - 20, 16);
            ctx.fillStyle = 'rgba(140, 180, 220, 0.5)';
            ctx.font = '11px "Segoe UI", sans-serif';
            ctx.fillText('(炸弹平抛运动 · 轨迹为抛物线)', W - 20, 38);
            ctx.restore();

            // ---- 高度标尺 ----
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.font = '9px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(180, 200, 220, 0.10)';
            const step = 60;
            for (let y = GROUND_Y - step; y > 40; y -= step) {
                const h = GROUND_Y - y;
                ctx.fillText(`${h}px`, 2, y + 2);
                ctx.strokeStyle = 'rgba(180, 200, 220, 0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            ctx.restore();

            // ---- 底部信息 ----
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.font = '11px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(180, 200, 220, 0.25)';
            const infoY = H - 6;
            const activeCount = state.bombs.filter(b => b.active).length;
            const landedCount = state.bombs.filter(b => b.landed).length;
            ctx.fillText(
                `速度: ${state.planeV.toFixed(1)}  高度: ${state.planeY.toFixed(0)}  间隔: ${state.dropInterval.toFixed(2)}s  模拟: ${(state.timeScale*100).toFixed(0)}%  总计: ${state.bombs.length} (活跃: ${activeCount} 落地: ${landedCount})`,
                12, infoY);
            ctx.restore();

            // ---- 提示 ----
            if (state.bombs.length === 0 && !state.continuousMode) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '18px "Segoe UI", sans-serif';
                ctx.fillStyle = 'rgba(180, 200, 220, 0.15)';
                ctx.fillText('点击「投弹」或「连续投弹」观察炸弹串 · 调节「速度」「高度」「间隔」', W / 2, 230);
                ctx.font = '14px "Segoe UI", sans-serif';
                ctx.fillStyle = 'rgba(180, 200, 220, 0.10)';
                ctx.fillText('黄色 = 飞机参考系 (竖直下落) · 蓝色 = 地面参考系 (平抛运动)', W / 2, 260);
                ctx.restore();
            }

            // ---- 连续投弹状态指示 ----
            if (state.continuousMode) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.font = '13px "Segoe UI", sans-serif';
                ctx.fillStyle = 'rgba(240, 192, 80, 0.5)';
                ctx.fillText(`🔁 连续投弹中 · 间隔 ${state.dropInterval.toFixed(2)}s · 已投 ${state.totalDropped} 颗`, W / 2, GROUND_Y -
                    4);
                ctx.restore();
            }

            // ---- 顶部提示：同一架飞机 ----
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(180, 200, 220, 0.15)';
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.fillText('✈️ 同一架飞机 · 两种参考系下的运动描述', W / 2, 2);
            ctx.restore();

            ctx.shadowBlur = 0;
        }

        // ---- 绘制飞机 ----
        function drawPlane(ctx, x, y, scale, color, alpha) {
            alpha = alpha || 1.0;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const fuselage = ctx.createLinearGradient(-30, -6, 30, 6);
            fuselage.addColorStop(0, '#4a7aaa');
            fuselage.addColorStop(0.5, color);
            fuselage.addColorStop(1, '#4a7aaa');
            ctx.fillStyle = fuselage;
            ctx.shadowBlur = 14;
            ctx.shadowColor = 'rgba(100, 180, 255, 0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 34, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#5a8aaa';
            ctx.shadowBlur = 8;
            ctx.fillRect(-26, -16, 12, 6);
            ctx.fillRect(-26, 10, 12, 6);
            ctx.fillRect(14, -16, 12, 6);
            ctx.fillRect(14, 10, 12, 6);

            ctx.fillStyle = '#4a7a9a';
            ctx.fillRect(-36, -10, 6, 20);
            ctx.fillRect(-40, -14, 6, 6);

            ctx.fillStyle = '#8ad0f0';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.ellipse(16, -3, 10, 6, 0.2, 0, Math.PI * 2);
            ctx.fill();

            if (state.planeV > 0.5 && alpha > 0.8) {
                const flicker = 0.7 + Math.random() * 0.3;
                ctx.fillStyle = `rgba(255, 180, 50, ${0.35 * flicker})`;
                ctx.shadowBlur = 18;
                ctx.shadowColor = 'rgba(255, 150, 50, 0.25)';
                ctx.beginPath();
                ctx.moveTo(-34, -3);
                ctx.quadraticCurveTo(-48, -8 * flicker, -40, 0);
                ctx.quadraticCurveTo(-48, 8 * flicker, -34, 3);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        // ---- 绘制炸弹 ----
        function drawBomb(ctx, x, y, color, glowColor, alpha, size) {
            size = size || 9;
            ctx.save();
            ctx.globalAlpha = alpha || 1.0;

            const glow = ctx.createRadialGradient(x, y, 2, x, y, size + 16);
            glow.addColorStop(0, glowColor || 'rgba(240, 192, 80, 0.25)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, size + 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 20;
            ctx.shadowColor = glowColor || 'rgba(240, 192, 80, 0.3)';
            const grad = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, size);
            grad.addColorStop(0, '#ffe880');
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, '#c08020');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            if (size > 6) {
                ctx.fillStyle = '#8a7a5a';
                ctx.shadowBlur = 4;
                const s = size * 0.4;
                ctx.fillRect(x - s * 0.3, y + size * 0.9, s * 0.6, s * 0.8);
                ctx.fillRect(x - s * 0.8, y + size * 1.1, s * 0.3, s * 0.5);
                ctx.fillRect(x + s * 0.5, y + size * 1.1, s * 0.3, s * 0.5);
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        // ---- 更新 ----
        function updateBombCount() {
            const active = state.bombs.filter(b => b.active).length;
            const total = state.bombs.length;
            bombCountDisplay.textContent = total;
            state.activeBombs = active;
        }

        function updateUI() {
            speedVal.textContent = state.planeV.toFixed(1);
            heightVal.textContent = state.planeY.toFixed(0);
            intervalVal.textContent = state.dropInterval.toFixed(2) + 's';
            speedScaleVal.textContent = state.timeScale.toFixed(2);
        }

        // ---- 动画循环 ----
        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        // ---- 事件绑定 ----
        btnDrop.addEventListener('click', function() {
            dropBomb();
            statusText.textContent = `💣 投弹 · 共 ${state.totalDropped} 颗`;
            statusPulse.className = 'pulse dropping';
            setTimeout(() => {
                if (!state.continuousMode && !state.paused) {
                    statusPulse.className = 'pulse idle';
                }
            }, 400);
        });

        btnContinuous.addEventListener('click', function() {
            state.continuousMode = !state.continuousMode;
            if (state.continuousMode) {
                state.dropTimer = 0;
                this.textContent = '⏹️ 停止投弹';
                this.className = 'btn btn-danger';
                statusPulse.className = 'pulse dropping';
                statusText.textContent = `🔁 连续投弹 · 间隔 ${state.dropInterval.toFixed(2)}s`;
                if (state.bombs.length === 0) dropBomb();
            } else {
                this.textContent = '🔁 连续投弹';
                this.className = 'btn btn-primary';
                statusPulse.className = 'pulse idle';
                statusText.textContent = `已停止 · 共投 ${state.totalDropped} 颗`;
            }
        });

        btnPause.addEventListener('click', function() {
            if (state.bombs.length === 0 && !state.continuousMode) return;
            state.paused = !state.paused;
            this.textContent = state.paused ? '▶️ 继续' : '⏸️ 暂停';
            statusPulse.className = state.paused ? 'pulse paused' : (state.continuousMode ? 'pulse dropping' : 'pulse idle');
            statusText.textContent = state.paused ? '已暂停' : (state.continuousMode ? '🔁 连续投弹' : '就绪');
        });

        btnReset.addEventListener('click', function() {
            const wasContinuous = state.continuousMode;
            resetSim(true);
            if (wasContinuous) {
                state.continuousMode = false;
                btnContinuous.textContent = '🔁 连续投弹';
                btnContinuous.className = 'btn btn-primary';
            }
            state.showTrail = true;
            btnTrajectory.textContent = '📐 轨迹';
            statusText.textContent = '已重置';
        });

        btnTrajectory.addEventListener('click', function() {
            state.showTrail = !state.showTrail;
            this.textContent = state.showTrail ? '📐 轨迹' : '📐 轨迹 (关)';
            if (!state.showTrail) {
                for (const b of state.bombs) b.trailGround = [];
            }
        });

        speedSlider.addEventListener('input', function() {
            if (state.bombs.length > 0 && !state.paused) return;
            state.planeV = parseFloat(this.value);
            speedVal.textContent = state.planeV.toFixed(1);
        });

        heightSlider.addEventListener('input', function() {
            if (state.bombs.length > 0 && !state.paused) return;
            state.planeY = parseFloat(this.value);
            heightVal.textContent = state.planeY.toFixed(0);
        });

        intervalSlider.addEventListener('input', function() {
            state.dropInterval = parseFloat(this.value);
            intervalVal.textContent = state.dropInterval.toFixed(2) + 's';
            if (state.continuousMode) {
                statusText.textContent = `🔁 连续投弹 · 间隔 ${state.dropInterval.toFixed(2)}s`;
            }
        });

        speedScaleSlider.addEventListener('input', function() {
            state.timeScale = parseFloat(this.value);
            speedScaleVal.textContent = state.timeScale.toFixed(2);
        });

        // ---- 键盘 ----
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (state.bombs.length === 0 && !state.continuousMode) {
                    dropBomb();
                } else {
                    btnPause.click();
                }
            }
            if (e.key === 'd' || e.key === 'D') dropBomb();
            if (e.key === 'c' || e.key === 'C') btnContinuous.click();
            if (e.key === 'r' || e.key === 'R') btnReset.click();
            if (e.key === 't' || e.key === 'T') btnTrajectory.click();
        });

        // ---- 启动 ----
        state.planeY = parseInt(heightSlider.value);
        state.planeV = parseFloat(speedSlider.value);
        state.timeScale = parseFloat(speedScaleSlider.value);
        state.dropInterval = parseFloat(intervalSlider.value);
        resetSim(true);
        state.showTrail = true;
        btnTrajectory.textContent = '📐 轨迹';
        loop();

        console.log('快捷键: 空格=投弹/暂停, D=投弹, C=连续投弹, R=重置, T=轨迹');
    </script>
</body>
</html>
