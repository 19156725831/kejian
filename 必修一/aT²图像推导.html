<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1220">
<title>Δx = aT² 图像推导</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background-color:#0a1220;
    background-image:radial-gradient(circle at 28% 0%,#16294a 0%,#0a1220 55%,#070d17 100%);
    color:#e8f1ff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
  }

  .chart-box{
    flex:1 1 auto;min-height:0;position:relative;
  }
  #cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}

  .ctrl{
    position:absolute;left:0;right:0;bottom:0;
    padding:8px 12px max(8px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:2px;
    background:linear-gradient(180deg,rgba(10,18,32,0) 0%,rgba(10,18,32,0.85) 40%,rgba(10,18,32,0.95) 100%);
    pointer-events:none;
  }
  .ctrl-row{
    display:flex;align-items:center;gap:8px;
    pointer-events:auto;
  }
  .ctrl-row label{
    font-size:12px;color:#8fb0d8;
    white-space:nowrap;letter-spacing:.3px;
    min-width:56px;
  }
  .ctrl-row b{
    color:#54d2ff;font-size:15px;font-weight:800;
    font-variant-numeric:tabular-nums;
    font-family:"DIN Alternate","Bahnschrift",sans-serif;
    min-width:42px;text-align:right;
  }
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;
    height:24px;background:transparent;outline:none;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:5px;border-radius:3px;
    background:linear-gradient(90deg,#2f6fb5,#54d2ff);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;
    background:#eaf6ff;border:3px solid #54d2ff;
    margin-top:-7.5px;
    box-shadow:0 2px 8px rgba(84,210,255,0.65);
  }
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#2f6fb5;}
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#eaf6ff;border:3px solid #54d2ff;
  }

  /* 开关行 */
  .switch-row{
    display:flex;align-items:center;justify-content:space-between;
    pointer-events:auto;
    padding:0 2px 2px;
  }
  .switch-row span{font-size:11.5px;color:#8fb0d8;letter-spacing:.3px;}
  .switch{
    position:relative;display:inline-block;
    width:40px;height:22px;flex:none;
  }
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{
    position:absolute;inset:0;
    background:rgba(90,140,210,0.25);
    border-radius:11px;
    transition:background .18s;
  }
  .switch .track::before{
    content:"";position:absolute;
    width:16px;height:16px;left:3px;top:3px;
    background:#8fb0d8;border-radius:50%;
    transition:transform .18s,background .18s;
  }
  .switch input:checked + .track{background:rgba(84,210,255,0.45);}
  .switch input:checked + .track::before{
    transform:translateX(18px);background:#eaf6ff;
  }
</style>
</head>
<body>

<div class="chart-box" id="chartBox">
  <canvas id="cv"></canvas>

  <div class="ctrl">
    <div class="ctrl-row">
      <label>v₀ (m/s)</label>
      <input type="range" id="sV0" min="0" max="4" value="1" step="0.5">
      <b id="v0Val">1</b>
    </div>
    <div class="ctrl-row">
      <label>a (m/s²)</label>
      <input type="range" id="sA" min="0.5" max="3" value="1.5" step="0.5">
      <b id="aVal">1.5</b>
    </div>
    <div class="ctrl-row">
      <label>T (s)</label>
      <input type="range" id="sT" min="1" max="3" value="2" step="0.5">
      <b id="tVal">2</b>
    </div>
    <div class="switch-row">
      <span>显示等效矩形（高 = 平均速度）</span>
      <label class="switch">
        <input type="checkbox" id="swRect">
        <span class="track"></span>
      </label>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var chartBox = document.getElementById('chartBox');

  var W = 0, H = 0;

  var v0 = 1, a = 1.5, T = 2;
  var N = 3;              // 显示 3 个时间间隔
  var tTotal;             // 总时间 = N*T
  var vEnd;               // 末速度
  var vmax;               // 纵轴上界
  var showRect = false;   // 是否显示等效矩形

  // 每段位移
  var xArr = [];

  function updateVals() {
    tTotal = N * T;
    vEnd = v0 + a * tTotal;
    vmax = vEnd * 1.14 + 0.3;

    xArr = [];
    for (var i = 0; i < N; i++) {
      var t1 = i * T;
      var t2 = (i + 1) * T;
      var v1 = v0 + a * t1;
      var v2 = v0 + a * t2;
      // 梯形面积
      var xi = (v1 + v2) / 2 * T;
      xArr.push({ x: xi, v1: v1, v2: v2, t1: t1, t2: t2 });
    }
  }

  function fmt(x, d) {
    if (d === undefined) d = 2;
    var s = Number(x).toFixed(d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function niceStep(max, target) {
    var raw = max / target;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var step;
    if (norm <= 1.5) step = 1;
    else if (norm <= 3) step = 2;
    else if (norm <= 7) step = 5;
    else step = 10;
    return step * mag;
  }

  function resize() {
    var rect = chartBox.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = w; H = h;
    draw();
  }

  /* ================= 绘制 ================= */
  function draw() {
    updateVals();
    ctx.clearRect(0, 0, W, H);

    var PL = Math.max(W * 0.085, 44);
    var PR = Math.max(W * 0.05, 22);
    var PT = Math.max(H * 0.085, 30);
    var PB = Math.max(H * 0.245, 118);

    var plotW = W - PL - PR;
    var plotH = H - PT - PB;

    function X(t) { return PL + (t / tTotal) * plotW; }
    function Y(v) { return PT + plotH - (v / vmax) * plotH; }

    // ---- 网格 ----
    ctx.save();
    ctx.strokeStyle = 'rgba(90,140,200,0.10)';
    ctx.lineWidth = 1;

    // 竖直网格：每个 T 一条
    for (var i = 0; i <= N; i++) {
      var xg = X(i * T);
      ctx.beginPath(); ctx.moveTo(xg, Y(0)); ctx.lineTo(xg, Y(vmax)); ctx.stroke();
    }
    // 水平网格
    var yStep = niceStep(vmax, 5);
    for (var v = yStep; v <= vmax; v += yStep) {
      var yg = Y(v);
      ctx.beginPath(); ctx.moveTo(X(0), yg); ctx.lineTo(X(tTotal), yg); ctx.stroke();
    }
    ctx.restore();

    // ---- 每个时间间隔的梯形填充（交替色）----
    var colors = [
      { fill: 'rgba(84,210,255,0.18)',  stroke: 'rgba(84,210,255,0.55)'  },
      { fill: 'rgba(255,184,74,0.20)',  stroke: 'rgba(255,184,74,0.60)'  },
      { fill: 'rgba(127,224,168,0.18)', stroke: 'rgba(127,224,168,0.55)' }
    ];

    for (var k = 0; k < N; k++) {
      var seg = xArr[k];
      var c = colors[k % 3];

      // 梯形
      ctx.beginPath();
      ctx.moveTo(X(seg.t1), Y(0));
      ctx.lineTo(X(seg.t1), Y(seg.v1));
      ctx.lineTo(X(seg.t2), Y(seg.v2));
      ctx.lineTo(X(seg.t2), Y(0));
      ctx.closePath();
      ctx.fillStyle = c.fill;
      ctx.fill();
      ctx.strokeStyle = c.stroke;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    // ---- 等效矩形（可选）----
    if (showRect) {
      for (var kr = 0; kr < N; kr++) {
        var sr = xArr[kr];
        var vr = (sr.v1 + sr.v2) / 2;   // 平均速度 = 中点高度
        ctx.beginPath();
        ctx.rect(X(sr.t1), Y(vr), X(sr.t2) - X(sr.t1), Y(0) - Y(vr));
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([5, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 矩形高度线
        ctx.beginPath();
        ctx.moveTo(X(sr.t1), Y(vr));
        ctx.lineTo(X(sr.t2), Y(vr));
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
    }

    // ---- v-t 斜线 ----
    ctx.beginPath();
    ctx.moveTo(X(0), Y(v0));
    ctx.lineTo(X(tTotal), Y(vEnd));
    ctx.strokeStyle = '#ffb84a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,184,74,0.55)';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ---- 坐标轴 ----
    ctx.save();
    var x0 = X(0), y0 = Y(0);
    var xE = X(tTotal), yT = Y(vmax);

    ctx.strokeStyle = 'rgba(160,195,235,0.85)';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, yT - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(xE + 12, y0); ctx.stroke();

    var ah = Math.max(4, Math.min(W, H) * 0.022);
    ctx.fillStyle = 'rgba(160,195,235,0.85)';
    ctx.beginPath();
    ctx.moveTo(x0, yT - ah * 2.6);
    ctx.lineTo(x0 - ah, yT - ah * 0.7);
    ctx.lineTo(x0 + ah, yT - ah * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(xE + ah * 4.4, y0);
    ctx.lineTo(xE + ah * 2.3, y0 - ah);
    ctx.lineTo(xE + ah * 2.3, y0 + ah);
    ctx.closePath(); ctx.fill();

    // 刻度：时间
    var fs = Math.max(10, Math.min(14, Math.min(W, H) * 0.033));
    ctx.font = 'bold ' + fs + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'rgba(180,210,240,0.9)';
    ctx.strokeStyle = 'rgba(150,185,225,0.5)';
    ctx.lineWidth = 1.2;
    var tick = Math.max(4, Math.min(W, H) * 0.020);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    for (var ti = 0; ti <= N; ti++) {
      var xt = X(ti * T);
      ctx.beginPath(); ctx.moveTo(xt, y0); ctx.lineTo(xt, y0 + tick); ctx.stroke();

      var label;
      if (ti === 0) label = '0';
      else if (ti === 1) label = 'T';
      else label = ti + 'T';
      ctx.fillText(label, xt, y0 + tick + 3);
    }

    // 刻度：速度
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var vv = yStep; vv <= vmax; vv += yStep) {
      var yv = Y(vv);
      ctx.beginPath(); ctx.moveTo(x0 - tick, yv); ctx.lineTo(x0, yv); ctx.stroke();
      ctx.fillText(String(Math.round(vv * 10) / 10), x0 - tick - 4, yv);
    }

    // 轴标注
    var fAx = fs * 1.45;
    ctx.font = 'bold ' + fAx + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = '#8fc9ff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('v', x0 + fAx * 0.35, yT - fAx * 0.15);

    ctx.font = 'bold ' + (fs * 0.9) + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'rgba(143,201,255,0.85)';
    ctx.fillText('/(m·s⁻¹)', x0 + fAx * 0.35 + fAx * 0.95, yT - fAx * 0.25);

    ctx.font = 'bold ' + fAx + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = '#8fc9ff';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('t', W - fs * 2.9, y0 + tick + 3);
    ctx.font = 'bold ' + (fs * 0.9) + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'rgba(143,201,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText('/s', W - fs * 2.5, y0 + tick + 3 + fAx * 0.18);
    ctx.restore();

    // ---- 各段位移标注 ----
    var fL = Math.max(11, Math.min(14, Math.min(W, H) * 0.032));
    ctx.font = 'bold ' + fL + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    for (var km = 0; km < N; km++) {
      var sm = xArr[km];
      var xm = (X(sm.t1) + X(sm.t2)) / 2;
      var ym = (Y(0) + Y((sm.v1 + sm.v2) / 2)) / 2;  // 梯形重心高度约在中间

      // 位移标注
      var labelStr = 'x' + (km + 1) + '=' + fmt(sm.x);

      // 文字背景
      var tw = ctx.measureText(labelStr).width;
      ctx.fillStyle = 'rgba(10,18,32,0.72)';
      ctx.fillRect(xm - tw / 2 - 5, ym - fL * 0.75, tw + 10, fL * 1.5);

      ctx.fillStyle = '#ffd98a';
      ctx.fillText(labelStr, xm, ym);
    }

    // ---- 速度刻度标注（v₀、v₀+aT、…）----
    var fS = Math.max(10, Math.min(12, Math.min(W, H) * 0.028));
    ctx.font = 'bold ' + fS + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    for (var kv = 0; kv <= N; kv++) {
      var vk = v0 + a * kv * T;
      var yk = Y(vk);
      var xk = X(kv * T);

      // 在轴上标点
      ctx.beginPath();
      ctx.arc(xk, yk, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffb84a';
      ctx.fill();

      // 文字
      var vLabel;
      if (kv === 0) vLabel = 'v₀';
      else if (kv === 1) vLabel = 'v₀+aT';
      else vLabel = 'v₀+' + kv + 'aT';

      ctx.fillStyle = 'rgba(255,200,120,0.95)';
      ctx.fillText(vLabel, xk + 7, yk - fS * 0.9);
    }

    // ---- 底部：Δx 推导区 ----
    drawBottomPanel();

    // ---- 显示等效矩形时的额外提示 ----
    if (showRect) {
      var fHint = Math.max(10, Math.min(12, Math.min(W, H) * 0.028));
      ctx.font = 'bold ' + fHint + 'px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('白色虚线矩形：高 = 平均速度 v̄ᵢ，面积 = 该段位移 xᵢ',
        W / 2, Y(0) - 8);
    }
  }

  /* ================= 底部推导面板 ================= */
  function drawBottomPanel() {
    var pad = Math.max(W * 0.04, 12);
    var yBase = H - Math.max(H * 0.245, 118) + 6;

    // 背景
    ctx.fillStyle = 'rgba(20,34,58,0.55)';
    ctx.fillRect(0, yBase - 4, W, H - yBase + 4);

    var fs = Math.max(11, Math.min(14, Math.min(W, H) * 0.032));
    ctx.font = 'bold ' + fs + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.textBaseline = 'top';

    var lineH = fs * 1.62;
    var xL = pad;
    var y = yBase + 4;

    // 第一行：各段位移
    var s1 = 'x₁=' + fmt(xArr[0].x) + '　x₂=' + fmt(xArr[1].x) + '　x₃=' + fmt(xArr[2].x);
    ctx.fillStyle = '#b3cee8';
    ctx.textAlign = 'left';
    ctx.fillText(s1, xL, y);
    y += lineH;

    // 第二行：差值
    var d12 = xArr[1].x - xArr[0].x;
    var d23 = xArr[2].x - xArr[1].x;
    var s2 = 'x₂−x₁=' + fmt(d12) + '　x₃−x₂=' + fmt(d23);
    ctx.fillStyle = '#7fe0a8';
    ctx.fillText(s2, xL, y);
    y += lineH;

    // 第三行：aT² 计算结果
    var aT2 = a * T * T;
    var s3 = 'aT² = ' + fmt(a) + '×' + fmt(T) + '² = ' + fmt(aT2);
    ctx.fillStyle = '#54d2ff';
    ctx.fillText(s3, xL, y);

    // 右侧结论
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd98a';
    ctx.font = 'bold ' + (fs * 1.2) + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillText('Δx = aT²', W - pad, yBase + 4);
  }

  /* ================= 交互 ================= */
  var sV0 = document.getElementById('sV0');
  var sA  = document.getElementById('sA');
  var sT  = document.getElementById('sT');
  var swRect = document.getElementById('swRect');

  sV0.addEventListener('input', function () {
    v0 = parseFloat(sV0.value);
    document.getElementById('v0Val').textContent = sV0.value;
    draw();
  }, false);

  sA.addEventListener('input', function () {
    a = parseFloat(sA.value);
    document.getElementById('aVal').textContent = sA.value;
    draw();
  }, false);

  sT.addEventListener('input', function () {
    T = parseFloat(sT.value);
    document.getElementById('tVal').textContent = sT.value;
    draw();
  }, false);

  swRect.addEventListener('change', function () {
    showRect = swRect.checked;
    draw();
  }, false);

  /* ================= 启动 ================= */
  window.addEventListener('load', resize, false);

  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 220);
    setTimeout(resize, 520);
  }, false);

  var rzTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(resize, 100);
  }, false);

  if (window.ResizeObserver) {
    try {
      new ResizeObserver(function () { resize(); }).observe(chartBox);
    } catch (e) {}
  }

  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, false);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

  resize();
})();
</script>
</body>
</html>
