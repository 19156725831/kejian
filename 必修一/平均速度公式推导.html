<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1220">
<title>平均速度 = (v₀+v)/2 = 中点瞬时速度</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background-color:#0a1220;
    background-image:radial-gradient(circle at 28% 0%,#16294a 0%,#0a1220 55%,#070d17 100%);
    color:#e8f1ff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
  }

  .chart-box{
    flex:1 1 auto;min-height:0;position:relative;
  }
  #cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}

  .ctrl{
    position:absolute;left:0;right:0;bottom:0;
    padding:8px 12px max(8px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:2px;
    background:linear-gradient(180deg,rgba(10,18,32,0) 0%,rgba(10,18,32,0.85) 40%,rgba(10,18,32,0.95) 100%);
    pointer-events:none;
  }
  .ctrl-row{
    display:flex;align-items:center;gap:8px;
    pointer-events:auto;
  }
  .ctrl-row label{
    font-size:12px;color:#8fb0d8;
    white-space:nowrap;letter-spacing:.3px;
    min-width:56px;
  }
  .ctrl-row b{
    color:#54d2ff;font-size:15px;font-weight:800;
    font-variant-numeric:tabular-nums;
    font-family:"DIN Alternate","Bahnschrift",sans-serif;
    min-width:42px;text-align:right;
  }
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;
    height:24px;background:transparent;outline:none;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:5px;border-radius:3px;
    background:linear-gradient(90deg,#2f6fb5,#54d2ff);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;
    background:#eaf6ff;border:3px solid #54d2ff;
    margin-top:-7.5px;
    box-shadow:0 2px 8px rgba(84,210,255,0.65);
  }
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#2f6fb5;}
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#eaf6ff;border:3px solid #54d2ff;
  }
</style>
</head>
<body>

<div class="chart-box" id="chartBox">
  <canvas id="cv"></canvas>

  <div class="ctrl">
    <div class="ctrl-row">
      <label>v₀ (m/s)</label>
      <input type="range" id="sV0" min="0" max="5" value="2" step="0.5">
      <b id="v0Val">2</b>
    </div>
    <div class="ctrl-row">
      <label>a (m/s²)</label>
      <input type="range" id="sA" min="0.5" max="3" value="1" step="0.5">
      <b id="aVal">1</b>
    </div>
    <div class="ctrl-row">
      <label>t (s)</label>
      <input type="range" id="sT" min="4" max="10" value="6" step="1">
      <b id="tVal">6</b>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var chartBox = document.getElementById('chartBox');

  var W = 0, H = 0;

  var v0 = 2, a = 1, T = 6;
  var vEnd, vAvg, vmax;

  function updateVals() {
    vEnd = v0 + a * T;
    vAvg = (v0 + vEnd) / 2;
    vmax = vEnd * 1.18 + 0.3;
  }

  function fmt(x, d) {
    if (d === undefined) d = 2;
    var s = Number(x).toFixed(d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function niceStep(max, target) {
    var raw = max / target;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var step;
    if (norm <= 1.5) step = 1;
    else if (norm <= 3) step = 2;
    else if (norm <= 7) step = 5;
    else step = 10;
    return step * mag;
  }

  function resize() {
    var rect = chartBox.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = w; H = h;
    draw();
  }

  /* ================= 绘制 ================= */
  function draw() {
    updateVals();
    ctx.clearRect(0, 0, W, H);

    var PL = Math.max(W * 0.085, 42);
    var PR = Math.max(W * 0.05, 22);
    var PT = Math.max(H * 0.080, 28);
    var PB = Math.max(H * 0.220, 105);   // 底部留给滑块

    var plotW = W - PL - PR;
    var plotH = H - PT - PB;

    function X(t) { return PL + (t / T) * plotW; }
    function Y(v) { return PT + plotH - (v / vmax) * plotH; }

    // ---- 网格 ----
    ctx.save();
    ctx.strokeStyle = 'rgba(90,140,200,0.11)';
    ctx.lineWidth = 1;
    for (var t = 0; t <= T; t++) {
      var x = X(t);
      ctx.beginPath(); ctx.moveTo(x, Y(0)); ctx.lineTo(x, Y(vmax)); ctx.stroke();
    }
    var yStep = niceStep(vmax, 5);
    for (var v = yStep; v <= vmax; v += yStep) {
      var y = Y(v);
      ctx.beginPath(); ctx.moveTo(X(0), y); ctx.lineTo(X(T), y); ctx.stroke();
    }
    ctx.restore();

    // ---- 矩形（匀速运动）填充 ----
    ctx.beginPath();
    ctx.rect(X(0), Y(vAvg), X(T) - X(0), Y(0) - Y(vAvg));
    ctx.fillStyle = 'rgba(84,210,255,0.09)';
    ctx.fill();

    // ---- 梯形（匀加速运动）填充 ----
    ctx.beginPath();
    ctx.moveTo(X(0), Y(0));
    ctx.lineTo(X(0), Y(v0));
    ctx.lineTo(X(T), Y(vEnd));
    ctx.lineTo(X(T), Y(0));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,184,74,0.15)';
    ctx.fill();

    // ---- 左三角形：矩形比梯形多出（蓝色）----
    ctx.beginPath();
    ctx.moveTo(X(0), Y(vAvg));
    ctx.lineTo(X(T / 2), Y(vAvg));
    ctx.lineTo(X(0), Y(v0));
    ctx.closePath();
    ctx.fillStyle = 'rgba(84,210,255,0.32)';
    ctx.fill();

    // ---- 右三角形：梯形比矩形多出（橙色）----
    ctx.beginPath();
    ctx.moveTo(X(T / 2), Y(vAvg));
    ctx.lineTo(X(T), Y(vAvg));
    ctx.lineTo(X(T), Y(vEnd));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,184,74,0.40)';
    ctx.fill();

    // ---- 矩形轮廓 ----
    ctx.beginPath();
    ctx.rect(X(0), Y(vAvg), X(T) - X(0), Y(0) - Y(vAvg));
    ctx.strokeStyle = 'rgba(84,210,255,0.80)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- 梯形斜边（v-t 图线）----
    ctx.beginPath();
    ctx.moveTo(X(0), Y(v0));
    ctx.lineTo(X(T), Y(vEnd));
    ctx.strokeStyle = '#ffb84a';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,184,74,0.55)';
    ctx.shadowBlur = 9;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ---- 水平线 v̄ ----
    ctx.beginPath();
    ctx.moveTo(X(0), Y(vAvg));
    ctx.lineTo(X(T), Y(vAvg));
    ctx.strokeStyle = '#54d2ff';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([7, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- 中点竖线 ----
    ctx.beginPath();
    ctx.moveTo(X(T / 2), Y(0));
    ctx.lineTo(X(T / 2), Y(vAvg));
    ctx.strokeStyle = 'rgba(127,224,168,0.85)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- 中点圆点（v̄ 与斜边交点）----
    ctx.beginPath();
    ctx.arc(X(T / 2), Y(vAvg), 6, 0, Math.PI * 2);
    ctx.fillStyle = '#7fe0a8';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // ---- 左右端点圆点 ----
    ctx.beginPath(); ctx.arc(X(0), Y(v0), 4, 0, 7);
    ctx.fillStyle = '#ffb84a'; ctx.fill();
    ctx.beginPath(); ctx.arc(X(T), Y(vEnd), 4, 0, 7);
    ctx.fillStyle = '#ffb84a'; ctx.fill();

    // ---- 坐标轴 ----
    ctx.save();
    var x0 = X(0), y0 = Y(0);
    var xE = X(T), yT = Y(vmax);

    ctx.strokeStyle = 'rgba(160,195,235,0.85)';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, yT - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(xE + 12, y0); ctx.stroke();

    var ah = Math.max(4, Math.min(W, H) * 0.022);
    ctx.fillStyle = 'rgba(160,195,235,0.85)';
    ctx.beginPath();
    ctx.moveTo(x0, yT - ah * 2.6);
    ctx.lineTo(x0 - ah, yT - ah * 0.7);
    ctx.lineTo(x0 + ah, yT - ah * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(xE + ah * 4.4, y0);
    ctx.lineTo(xE + ah * 2.3, y0 - ah);
    ctx.lineTo(xE + ah * 2.3, y0 + ah);
    ctx.closePath(); ctx.fill();

    // 刻度
    var fs = Math.max(10, Math.min(14, Math.min(W, H) * 0.034));
    ctx.font = 'bold ' + fs + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'rgba(180,210,240,0.9)';
    ctx.strokeStyle = 'rgba(150,185,225,0.5)';
    ctx.lineWidth = 1.2;
    var tick = Math.max(4, Math.min(W, H) * 0.020);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (var tt = 1; tt <= T; tt++) {
      var xx = X(tt);
      ctx.beginPath(); ctx.moveTo(xx, y0); ctx.lineTo(xx, y0 + tick); ctx.stroke();
      ctx.fillText(String(tt), xx, y0 + tick + 3);
    }
    ctx.fillText('0', x0 - fs * 0.9, y0 + tick + 3);

    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var vv = yStep; vv <= vmax; vv += yStep) {
      var yy = Y(vv);
      ctx.beginPath(); ctx.moveTo(x0 - tick, yy); ctx.lineTo(x0, yy); ctx.stroke();
      ctx.fillText(String(Math.round(vv * 10) / 10), x0 - tick - 4, yy);
    }

    // 轴标注
    var fAx = fs * 1.45;
    ctx.font = 'bold ' + fAx + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = '#8fc9ff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('v', x0 + fAx * 0.35, yT - fAx * 0.15);

    ctx.font = 'bold ' + (fs * 0.9) + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'rgba(143,201,255,0.85)';
    ctx.fillText('/(m·s⁻¹)', x0 + fAx * 0.35 + fAx * 0.95, yT - fAx * 0.25);

    ctx.font = 'bold ' + fAx + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = '#8fc9ff';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('t', W - fs * 2.9, y0 + tick + 3);
    ctx.font = 'bold ' + (fs * 0.9) + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'rgba(143,201,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText('/s', W - fs * 2.5, y0 + tick + 3 + fAx * 0.18);
    ctx.restore();

    // ---- 关键点标注 ----
    var fL = Math.max(11, Math.min(14, Math.min(W, H) * 0.032));
    ctx.font = 'bold ' + fL + 'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.textBaseline = 'middle';

    // v₀
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffb84a';
    ctx.fillText('v₀=' + fmt(v0), X(0) + 8, Y(v0) - fL * 1.0);

    // v
    ctx.textAlign = 'right';
    ctx.fillText('v=' + fmt(vEnd), X(T) - 8, Y(vEnd) - fL * 1.0);

    // v̄
    ctx.textAlign = 'left';
    ctx.fillStyle = '#54d2ff';
    ctx.fillText('v̄=' + fmt(vAvg), X(0) + 8, Y(vAvg) - fL * 0.85);

    // t/2
    ctx.fillStyle = '#7fe0a8';
    ctx.textAlign = 'center';
    ctx.fillText('t/2', X(T / 2), Y(0) + fL * 1.9);

    // ---- 三角形内标注 ----
    if (W > 280) {
      var fS = fL * 0.85;
      ctx.font = 'bold ' + fS + 'px -apple-system,BlinkMacSystemFont,sans-serif';

      ctx.fillStyle = 'rgba(120,220,255,0.95)';
      ctx.textAlign = 'center';
      ctx.fillText('多出', X(T * 0.14), Y(vAvg - (vAvg - v0) * 0.50));

      ctx.fillStyle = 'rgba(255,200,120,0.95)';
      ctx.fillText('补上', X(T * 0.86), Y(vAvg + (vEnd - vAvg) * 0.50));
    }
  }

  /* ================= 滑块 ================= */
  var sV0 = document.getElementById('sV0');
  var sA  = document.getElementById('sA');
  var sT  = document.getElementById('sT');

  sV0.addEventListener('input', function () {
    v0 = parseFloat(sV0.value);
    document.getElementById('v0Val').textContent = sV0.value;
    draw();
  }, false);

  sA.addEventListener('input', function () {
    a = parseFloat(sA.value);
    document.getElementById('aVal').textContent = sA.value;
    draw();
  }, false);

  sT.addEventListener('input', function () {
    T = parseFloat(sT.value);
    document.getElementById('tVal').textContent = sT.value;
    draw();
  }, false);

  /* ================= 启动 ================= */
  window.addEventListener('load', resize, false);

  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 220);
    setTimeout(resize, 520);
  }, false);

  var rzTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(resize, 100);
  }, false);

  if (window.ResizeObserver) {
    try {
      new ResizeObserver(function () { resize(); }).observe(chartBox);
    } catch (e) {}
  }

  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, false);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

  resize();
})();
</script>
</body>
</html>
