<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高一物理 · 时间 路程 位移 (含时刻与时间间隔)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 42px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-weight: 700;
            font-size: 28px;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 small {
            font-weight: 400;
            font-size: 16px;
            color: #4a6a85;
            background: rgba(0, 0, 0, 0.04);
            padding: 2px 14px;
            border-radius: 40px;
        }
        .path-tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.04);
            padding: 5px;
            border-radius: 60px;
            flex-wrap: wrap;
        }
        .path-tabs button {
            border: none;
            background: transparent;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s;
        }
        .path-tabs button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .path-tabs button.active {
            background: #ffffff;
            color: #0b2b4a;
            box-shadow: 0 4px 12px rgba(0, 20, 40, 0.08);
        }
        .main-area {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .canvas-wrapper {
            flex: 1 1 780px;
            min-width: 0;
            background: #ffffff;
            border-radius: 28px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 10;
            border-radius: 24px;
            background: #fcfcfc;
            touch-action: none;
        }
        .info-panel {
            flex: 0 0 300px;
            min-width: 240px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 22px 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 20, 40, 0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .info-panel h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0b1e33;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .concept-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            padding: 12px 10px;
        }
        .concept-item {
            text-align: center;
            padding: 6px 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
        }
        .concept-item .name {
            font-weight: 700;
            font-size: 15px;
        }
        .concept-item .type {
            font-size: 12px;
            color: #5a7a95;
            background: rgba(0, 0, 0, 0.04);
            padding: 0 8px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 2px;
        }
        .concept-item .def {
            font-size: 12px;
            color: #2c3e50;
            margin-top: 4px;
            line-height: 1.4;
        }
        .c-time .name { color: #e67e22; }
        .c-path .name { color: #2980b9; }
        .c-disp .name { color: #8e44ad; }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 14px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            padding: 12px 14px;
        }
        .data-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.04);
        }
        .data-item .label {
            color: #4a6a85;
            font-weight: 500;
        }
        .data-item .value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        .value.time-c { color: #e67e22; }
        .value.path-c { color: #2980b9; }
        .value.disp-c { color: #8e44ad; }
        .value.moment-c { color: #d35400; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 2px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .control-row label {
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
            min-width: 44px;
        }
        .control-row input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #d0dce8;
            border-radius: 4px;
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1a3a5c;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .control-row .val {
            min-width: 48px;
            text-align: right;
            font-weight: 600;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(0, 0, 0, 0.04);
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .btn-primary {
            background: #1a3a5c;
            color: white;
        }
        .btn-primary:hover {
            background: #0f2a44;
        }
        .btn-primary.active {
            background: #e67e22;
        }

        .desc-box {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 13px;
            line-height: 1.6;
            color: #1a3349;
            border-left: 4px solid #4a8ab5;
            margin-top: 2px;
        }
        .desc-box strong { color: #0b2b4a; }
        .desc-box .highlight { color: #d35400; }

        @media (max-width: 820px) {
            .app { padding: 18px 16px; }
            .header h1 { font-size: 22px; }
            .path-tabs button { font-size: 13px; padding: 6px 14px; }
            .info-panel { flex: 1 1 100%; }
            .concept-grid { grid-template-columns: 1fr 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: stretch; }
            .path-tabs { justify-content: center; }
            .concept-grid { grid-template-columns: 1fr; }
            .data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>⏱️ 时间 · 路程 · 位移 <small>时刻与时间间隔</small></h1>
        <div class="path-tabs" id="pathTabs">
            <button class="active" data-path="line">➖ 直线</button>
            <button data-path="angle">↗ 折线</button>
            <button data-path="curve">〰️ 曲线</button>
        </div>
    </div>
    <div class="main-area">
        <div class="canvas-wrapper">
            <canvas id="mainCanvas" width="1280" height="800"></canvas>
        </div>
        <div class="info-panel">
            <h3>📊 实时数据</h3>

            <div class="concept-grid">
                <div class="concept-item c-time">
                    <div class="name">⏱️ 时间</div>
                    <div class="type">标量</div>
                    <div class="def">运动过程的持续</div>
                </div>
                <div class="concept-item c-path">
                    <div class="name">📏 路程</div>
                    <div class="type">标量</div>
                    <div class="def">轨迹长度</div>
                </div>
                <div class="concept-item c-disp">
                    <div class="name">🧭 位移</div>
                    <div class="type">矢量</div>
                    <div class="def">位置变化 (起点→终点)</div>
                </div>
            </div>

            <div class="data-grid" id="dataDisplay">
                <div class="data-item"><span class="label">🕒 当前时刻</span><span class="value moment-c" id="momentVal">0.00 s</span></div>
                <div class="data-item"><span class="label">⏱️ 时间间隔</span><span class="value time-c" id="timeVal">0.00 s</span></div>
                <div class="data-item"><span class="label">📏 路程</span><span class="value path-c" id="pathVal">0.00 m</span></div>
                <div class="data-item"><span class="label">🧭 位移大小</span><span class="value disp-c" id="dispVal">0.00 m</span></div>
                <div class="data-item"><span class="label">🧭 位移方向</span><span class="value disp-c" id="dirVal">0°</span></div>
                <div class="data-item"><span class="label">⏱️ 总时间间隔</span><span class="value time-c" id="totalTimeVal">10.00 s</span></div>
            </div>

            <div class="control-group">
                <div class="control-row">
                    <label>进度</label>
                    <input type="range" id="progressSlider" min="0" max="1" step="0.001" value="0" />
                    <span class="val" id="progressVal">0%</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="playBtn">▶ 播放</button>
                    <button class="btn" id="resetBtn">⟲ 重置</button>
                </div>
            </div>

            <div class="desc-box" id="descBox">
                💡 <span class="highlight">时刻</span> 是某一瞬间，<span class="highlight">时间间隔</span> 是两个时刻的差值。<br>
                拖动进度条或播放，观察物体运动。
            </div>
        </div>
    </div>
</div>
<script>
    (function() {
        // ----- DOM -----
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const pathTabs = document.getElementById('pathTabs');
        const progressSlider = document.getElementById('progressSlider');
        const progressVal = document.getElementById('progressVal');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const momentVal = document.getElementById('momentVal');
        const timeVal = document.getElementById('timeVal');
        const pathVal = document.getElementById('pathVal');
        const dispVal = document.getElementById('dispVal');
        const dirVal = document.getElementById('dirVal');
        const totalTimeVal = document.getElementById('totalTimeVal');
        const descBox = document.getElementById('descBox');

        // ----- 尺寸 -----
        let W = 1280, H = 800;
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const cw = rect.width || 780;
            const aspect = 16/10;
            let w = cw, h = w/aspect;
            const maxH = window.innerHeight * 0.7;
            if (h > maxH) { h = maxH; w = h * aspect; }
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            W = 1280; H = 800;
            canvas.width = W; canvas.height = H;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // ----- 路径定义 -----
        // 三种类型: 'line' 直线, 'polyline' 折线, 'spline' 平滑曲线 (Catmull-Rom)
        const paths = {
            line: {
                type: 'line',
                points: [{x: 150, y: 450}, {x: 650, y: 450}],
                label: '直线'
            },
            angle: {
                type: 'polyline',
                points: [{x: 150, y: 450}, {x: 400, y: 220}, {x: 650, y: 450}],
                label: '折线'
            },
            curve: {
                type: 'spline',
                points: [
                    {x: 150, y: 450},
                    {x: 240, y: 160},
                    {x: 400, y: 300},
                    {x: 520, y: 160},
                    {x: 650, y: 450}
                ],
                label: '曲线'
            }
        };
        let currentPath = 'line';

        // ----- 样条插值 (Catmull-Rom) -----
        function catmullRom2D(points, t) {
            const n = points.length;
            if (n < 2) return points[0] || {x:0,y:0};
            if (t <= 0) return { ...points[0] };
            if (t >= 1) return { ...points[n-1] };
            const segments = n - 1;
            const segLen = 1 / segments;
            const segIndex = Math.min(Math.floor(t / segLen), segments - 1);
            const localT = (t - segIndex * segLen) / segLen;
            const i0 = Math.max(0, segIndex - 1);
            const i1 = segIndex;
            const i2 = Math.min(segIndex + 1, n - 1);
            const i3 = Math.min(segIndex + 2, n - 1);
            const p0 = points[i0];
            const p1 = points[i1];
            const p2 = points[i2];
            const p3 = points[i3];
            const t2 = localT * localT;
            const t3 = t2 * localT;
            const x = 0.5 * (
                (2 * p1.x) +
                (-p0.x + p2.x) * localT +
                (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
            );
            const y = 0.5 * (
                (2 * p1.y) +
                (-p0.y + p2.y) * localT +
                (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
            );
            return {x, y};
        }

        // ----- 获取路径点（根据类型和进度）-----
        function getPointOnPath(pathKey, progress) {
            const path = paths[pathKey];
            if (!path) return {x:0, y:0};
            const pts = path.points;
            if (path.type === 'line' || path.type === 'polyline') {
                // 线性插值 (折线)
                if (progress <= 0) return { ...pts[0] };
                if (progress >= 1) return { ...pts[pts.length-1] };
                const totalLen = calcPathLength(pathKey);
                let target = progress * totalLen;
                let accumulated = 0;
                for (let i = 1; i < pts.length; i++) {
                    const dx = pts[i].x - pts[i-1].x;
                    const dy = pts[i].y - pts[i-1].y;
                    const segLen = Math.sqrt(dx*dx + dy*dy);
                    if (target <= accumulated + segLen || i === pts.length-1) {
                        const t = (target - accumulated) / segLen;
                        return {
                            x: pts[i-1].x + dx * t,
                            y: pts[i-1].y + dy * t
                        };
                    }
                    accumulated += segLen;
                }
                return { ...pts[pts.length-1] };
            } else if (path.type === 'spline') {
                // 样条曲线: 直接用进度映射到 [0,1] 参数
                return catmullRom2D(pts, progress);
            }
            return {x:0,y:0};
        }

        // ----- 计算路径总长度 -----
        function calcPathLength(pathKey) {
            const path = paths[pathKey];
            if (!path) return 0;
            const pts = path.points;
            if (path.type === 'line' || path.type === 'polyline') {
                let total = 0;
                for (let i = 1; i < pts.length; i++) {
                    const dx = pts[i].x - pts[i-1].x;
                    const dy = pts[i].y - pts[i-1].y;
                    total += Math.sqrt(dx*dx + dy*dy);
                }
                return total;
            } else if (path.type === 'spline') {
                // 数值积分: 采样100个点
                const N = 200;
                let total = 0;
                let prev = catmullRom2D(pts, 0);
                for (let i = 1; i <= N; i++) {
                    const t = i / N;
                    const cur = catmullRom2D(pts, t);
                    const dx = cur.x - prev.x;
                    const dy = cur.y - prev.y;
                    total += Math.sqrt(dx*dx + dy*dy);
                    prev = cur;
                }
                return total;
            }
            return 0;
        }

        // ----- 获取当前路径 -----
        function getCurrentPath() { return paths[currentPath]; }

        // ----- 状态 -----
        let progress = 0;
        let isPlaying = false;
        let animId = null;
        const totalTime = 10; // 秒

        // ----- 绘制 -----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            const path = getCurrentPath();
            const pts = path.points;
            const totalLen = calcPathLength(currentPath);
            const pos = getPointOnPath(currentPath, progress);
            const start = pts[0];
            const end = pts[pts.length-1];
            const walked = progress * totalLen;

            // 网格
            ctx.save();
            ctx.strokeStyle = '#eef3f8';
            ctx.lineWidth = 1;
            for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
            for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
            ctx.restore();

            // 坐标轴
            ctx.save();
            ctx.strokeStyle = '#c8d6e5';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 6]);
            const ox = 80, oy = H - 60;
            ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(W-40, oy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, 40); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#6a8a9a';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('x / m', W-40, oy+8);
            ctx.textBaseline = 'bottom';
            ctx.fillText('y / m', ox+12, 40);
            ctx.textBaseline = 'top';
            ctx.font = '14px sans-serif';
            ctx.fillText('O', ox-6, oy+6);
            ctx.font = '12px sans-serif';
            ctx.fillStyle = '#8aa8b8';
            for (let i = 0; i <= 600; i+=100) {
                const px = ox + i * 0.8;
                if (px < W-40) {
                    ctx.beginPath(); ctx.moveTo(px, oy-5); ctx.lineTo(px, oy+5); ctx.stroke();
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    ctx.fillText((i/100).toFixed(1), px, oy+8);
                }
            }
            ctx.restore();

            // ---- 时间标注 ----
            ctx.save();
            ctx.font = 'bold 16px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            const tNow = progress * totalTime;
            ctx.fillStyle = '#d35400';
            ctx.fillText('t₀ = 0', start.x, start.y - 40);
            ctx.fillStyle = '#d35400';
            ctx.fillText(`t = ${totalTime.toFixed(1)} s`, end.x, end.y - 40);
            if (progress > 0.01 && progress < 0.99) {
                ctx.fillStyle = '#e67e22';
                ctx.fillText(`t = ${tNow.toFixed(2)} s`, pos.x, pos.y - 45);
                ctx.fillStyle = '#e67e22';
                ctx.font = '14px sans-serif';
                ctx.fillText(`Δt = ${tNow.toFixed(2)} s`, pos.x, pos.y - 65);
            }
            ctx.restore();

            // ---- 完整路径 (灰色虚线) ----
            ctx.save();
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = '#b0c4d8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (path.type === 'spline') {
                // 样条曲线: 绘制平滑曲线（采样点连成折线）
                const N = 100;
                for (let i = 0; i <= N; i++) {
                    const t = i / N;
                    const p = catmullRom2D(pts, t);
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
            } else {
                for (let i = 0; i < pts.length; i++) {
                    if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
                    else ctx.lineTo(pts[i].x, pts[i].y);
                }
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // ---- 已走路程 (彩色高亮) ----
            if (progress > 0) {
                ctx.save();
                const hue = 200 - progress * 160;
                ctx.strokeStyle = `hsl(${hue}, 80%, 55%)`;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (path.type === 'spline') {
                    // 根据进度绘制已走曲线段
                    const N = 200;
                    const target = progress;
                    let prev = catmullRom2D(pts, 0);
                    ctx.beginPath();
                    ctx.moveTo(prev.x, prev.y);
                    for (let i = 1; i <= N; i++) {
                        const t = i / N;
                        if (t > target) break;
                        const cur = catmullRom2D(pts, t);
                        ctx.lineTo(cur.x, cur.y);
                        prev = cur;
                    }
                    // 最后一点精确到进度位置
                    const finalP = getPointOnPath(currentPath, progress);
                    ctx.lineTo(finalP.x, finalP.y);
                    ctx.stroke();
                } else {
                    // 折线或直线: 分段绘制
                    let remaining = progress * totalLen;
                    let accumulated = 0;
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) {
                        const dx = pts[i].x - pts[i-1].x;
                        const dy = pts[i].y - pts[i-1].y;
                        const segLen = Math.sqrt(dx*dx + dy*dy);
                        if (remaining <= accumulated + segLen || i === pts.length-1) {
                            const t = (remaining - accumulated) / segLen;
                            const px = pts[i-1].x + dx * t;
                            const py = pts[i-1].y + dy * t;
                            ctx.lineTo(px, py);
                            break;
                        } else {
                            ctx.lineTo(pts[i].x, pts[i].y);
                        }
                        accumulated += segLen;
                    }
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ---- 起点 ----
            ctx.save();
            ctx.shadowColor = 'rgba(46, 204, 113, 0.4)';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(start.x, start.y, 12, 0, Math.PI*2);
            ctx.fillStyle = '#2ecc71';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#1a5a3a';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('起点', start.x, start.y-18);
            ctx.restore();

            // ---- 终点 ----
            ctx.save();
            ctx.shadowColor = 'rgba(231, 76, 60, 0.3)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(end.x, end.y, 12, 0, Math.PI*2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#8a2a1a';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('终点', end.x, end.y-18);
            ctx.restore();

            // ---- 当前位置 ----
            if (progress > 0) {
                ctx.save();
                const grad = ctx.createRadialGradient(pos.x, pos.y, 4, pos.x, pos.y, 30);
                grad.addColorStop(0, 'rgba(52, 152, 219, 0.6)');
                grad.addColorStop(1, 'rgba(52, 152, 219, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 30, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowColor = 'rgba(52, 152, 219, 0.5)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 14, 0, Math.PI*2);
                ctx.fillStyle = '#3498db';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#1a3a5c';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('物体', pos.x, pos.y-20);
                ctx.restore();
            }

            // ---- 位移向量 ----
            if (progress > 0.01) {
                const dx = pos.x - start.x;
                const dy = pos.y - start.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 2) {
                    ctx.save();
                    const angle = Math.atan2(dy, dx);
                    const len = Math.min(dist, 300);
                    const ex = start.x + dx/dist * len;
                    const ey = start.y + dy/dist * len;
                    ctx.strokeStyle = '#8e44ad';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    const hs = 16;
                    ctx.fillStyle = '#8e44ad';
                    ctx.beginPath();
                    ctx.moveTo(ex, ey);
                    ctx.lineTo(ex - hs * Math.cos(angle - 0.5), ey - hs * Math.sin(angle - 0.5));
                    ctx.lineTo(ex - hs * Math.cos(angle + 0.5), ey - hs * Math.sin(angle + 0.5));
                    ctx.closePath();
                    ctx.fill();
                    const midX = (start.x + ex)/2, midY = (start.y + ey)/2;
                    const offX = -dy/dist * 22, offY = dx/dist * 22;
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('位移', midX + offX, midY + offY - 4);
                    ctx.font = '14px "JetBrains Mono", monospace';
                    ctx.fillStyle = '#6a3a7a';
                    ctx.fillText(`${dist.toFixed(1)} m`, midX + offX, midY + offY + 20);
                    ctx.restore();
                }
            }

            // ---- 总路程标注 ----
            ctx.save();
            ctx.fillStyle = '#4a6a85';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`总路程 = ${totalLen.toFixed(1)} m`, end.x + 20, end.y - 10);
            ctx.restore();

            // ---- 图例 ----
            ctx.save();
            ctx.font = '13px sans-serif';
            const lx = 24, ly = 24;
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(lx, ly, 20, 4);
            ctx.fillStyle = '#2c3e50';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('已走路程', lx+26, ly-4);
            ctx.fillStyle = '#8e44ad';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(lx, ly+22);
            ctx.lineTo(lx+20, ly+22);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#2c3e50';
            ctx.fillText('位移', lx+26, ly+16);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(lx, ly+40, 20, 4);
            ctx.fillStyle = '#2c3e50';
            ctx.fillText('时刻标注', lx+26, ly+38);
            ctx.restore();
        }

        // ----- 更新数据 -----
        function updateData() {
            const path = getCurrentPath();
            const pts = path.points;
            const totalLen = calcPathLength(currentPath);
            const pos = getPointOnPath(currentPath, progress);
            const start = pts[0];
            const walked = progress * totalLen;
            const dx = pos.x - start.x;
            const dy = pos.y - start.y;
            const disp = Math.sqrt(dx*dx + dy*dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            const tNow = progress * totalTime;
            momentVal.textContent = tNow.toFixed(2) + ' s';
            timeVal.textContent = tNow.toFixed(2) + ' s';
            pathVal.textContent = walked.toFixed(2) + ' m';
            dispVal.textContent = disp.toFixed(2) + ' m';
            dirVal.textContent = angle.toFixed(1) + '°';
            totalTimeVal.textContent = totalTime.toFixed(2) + ' s';

            progressVal.textContent = Math.round(progress * 100) + '%';
            progressSlider.value = progress;

            let desc = `💡 <span class="highlight">时刻</span> 是某一瞬间，<span class="highlight">时间间隔</span> 是两个时刻的差值。`;
            if (currentPath === 'line') desc += ' 直线运动：路程 = 位移大小。';
            else if (currentPath === 'angle') desc += ' 折线运动：路程 > 位移大小。';
            else desc += ' 曲线运动：路程 > 位移大小，方向持续变化。';
            if (progress > 0.99) desc += ' <span style="color:#e74c3c;">✔ 到达终点！</span>';
            descBox.innerHTML = desc;
        }

        function updateAll() {
            draw();
            updateData();
        }

        // ----- 播放控制 -----
        function startPlay() {
            if (isPlaying) return;
            if (progress >= 1) progress = 0;
            isPlaying = true;
            playBtn.textContent = '⏸ 暂停';
            playBtn.classList.add('active');
            cancelAnimationFrame(animId);
            let lastTime = performance.now();

            function step(timestamp) {
                if (!isPlaying) return;
                const dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                progress += dt / totalTime;
                if (progress >= 1) {
                    progress = 1;
                    isPlaying = false;
                    playBtn.textContent = '▶ 播放';
                    playBtn.classList.remove('active');
                    updateAll();
                    return;
                }
                updateAll();
                animId = requestAnimationFrame(step);
            }
            animId = requestAnimationFrame(step);
        }

        function pausePlay() {
            if (!isPlaying) return;
            isPlaying = false;
            playBtn.textContent = '▶ 播放';
            playBtn.classList.remove('active');
            cancelAnimationFrame(animId);
        }

        function togglePlay() {
            if (isPlaying) pausePlay();
            else startPlay();
        }

        function resetAll() {
            pausePlay();
            progress = 0;
            updateAll();
        }

        // ----- 路径切换 -----
        function setPath(name) {
            if (name === currentPath) return;
            pausePlay();
            currentPath = name;
            progress = 0;
            document.querySelectorAll('.path-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.path === name);
            });
            updateAll();
        }

        // ----- 事件绑定 -----
        pathTabs.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn) setPath(btn.dataset.path);
        });

        progressSlider.addEventListener('input', (e) => {
            if (isPlaying) pausePlay();
            progress = parseFloat(e.target.value);
            updateAll();
        });

        playBtn.addEventListener('click', togglePlay);
        resetBtn.addEventListener('click', resetAll);

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'KeyR') resetAll();
        });

        window.addEventListener('resize', () => resizeCanvas());

        // ----- 初始化 -----
        resizeCanvas();
        updateAll();
        console.log('✅ 时间·路程·位移 (含时刻与时间间隔) 课件加载完成！');
        console.log('💡 按 空格键 播放/暂停，按 R 键 重置');
    })();
</script>
</body>
</html>
